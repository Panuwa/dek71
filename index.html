            math1: ["เซต & ตรรกศาสตร์", "จำนวนจริง", "ฟังก์ชัน", "เรขาคณิตวิเคราะห์ & ภาคตัดกรวย", "ฟังก์ชันเอกซ์โพ & ลอการิทึม", "ฟังก์ชันตรีโกณมิติ", "เมทริกซ์", "เวกเตอร์", "จำนวนเชิงซ้อน", "หลักการนับ & ความน่าจะเป็น", "ลำดับและอนุกรม", "แคลคูลัสเบื้องต้น", "สถิติและการแจกแจงความน่าจะเป็น"],

            chem: ["ความปลอดภัยและทักษะฯ", "อะตอมและสมบัติของธาตุ", "พันธะเคมี", "โมลและสูตรเคมี", "สารละลาย", "ปริมาณสารสัมพันธ์", "แก๊สและสมบัติของแก๊ส", "อัตราการเกิดปฏิกิริยาเคมี", "สมดุลเคมี", "กรด-เบส", "เคมีไฟฟ้า", "เคมีอินทรีย์", "พอลิเมอร์", "เคมีกับการแก้ปัญหา"],
            bio: ["ธรรมชาติของสิ่งมีชีวิต", "เคมีที่เป็นพื้นฐานของสิ่งมีชีวิต", "เซลล์และการทำงานของเซลล์", "ระบบย่อยอาหาร", "ระบบหายใจ", "ระบบหมุนเวียนเลือด", "ระบบภูมิคุ้มกัน", "ระบบขับถ่าย", "ระบบประสาทและอวัยวะรับความรู้สึก", "ระบบต่อมไร้ท่อ", "การเคลื่อนที่ของสิ่งมีชีวิต", "การสืบพันธุ์และการเจริญเติบโต", "พืช: โครงสร้างและหน้าที่", "พืช: การสังเคราะห์ด้วยแสง", "พืช: การสืบพันธุ์", "พันธุศาสตร์และวิวัฒนาการ", "ระบบนิเวศ"],

            thai: ["หลักการใช้ภาษาไทย", "การอ่านจับใจความ", "การเขียนเพื่อการสื่อสาร", "วรรณคดีวิจารณ์"],
            soc: ["ศาสนา ศีลธรรม จริยธรรม", "หน้าที่พลเมือง", "เศรษฐศาสตร์", "ประวัติศาสตร์", "ภูมิศาสตร์"]
        };

        const Icons = {
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v6a5 5 0 1 1-10 0V4"/><line x1="7" y1="9" x2="17" y2="9"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        // --- GRAPH COMPONENT ---
        const ScoreChart = ({ history, targetScore }) => {
            if (!history || history.length < 2) return (
                <div className="flex flex-col items-center justify-center h-32 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-gray-400 text-xs">
                    <Icons.Trophy />
                    <span className="mt-2 text-center">บันทึกคะแนนสอบจำลองอย่างน้อย 2 ครั้งเพื่อวิเคราะห์สถิติกราฟแนวโน้ม</span>
                </div>
            );
            const height = 120; const width = 500; const padding = 20; const maxScore = 100;
            const xStep = (width - padding * 2) / (history.length - 1);
            const points = history.map((entry, idx) => `${padding + idx * xStep},${height - padding - (entry.score / maxScore) * (height - padding * 2)}`).join(' ');
            const targetY = height - padding - (targetScore / maxScore) * (height - padding * 2);
            return (
                <div className="w-full overflow-hidden mb-6">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full bg-white rounded-lg border border-gray-100 shadow-sm">
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="#e5e7eb" />
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="#e5e7eb" strokeDasharray="4" />
                        {targetScore > 0 && <line x1={padding} y1={targetY} x2={width-padding} y2={targetY} stroke="#10b981" strokeDasharray="4" opacity="0.5" />}
                        <polyline points={points} fill="none" stroke="#4f46e5" strokeWidth="2" />
                        {history.map((entry, idx) => (
                            <g key={idx}>
                                <circle cx={padding + idx * xStep} cy={height - padding - (entry.score / maxScore) * (height - padding * 2)} r="4" fill="#fff" stroke="#4f46e5" strokeWidth="2" />
                                <text x={padding + idx * xStep} y={height - padding - (entry.score / maxScore) * (height - padding * 2) - 10} textAnchor="middle" fontSize="10" fill="#6b7280">{entry.score}</text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        // --- SUBJECT MODAL COMPONENT ---
        const SubjectModal = ({ subject, onClose, onUpdateTopic, onAddCustomTopic, onDeleteCustomTopic, onAddScore, onUpdateTarget }) => {
            if (!subject) return null;
            const [newScore, setNewScore] = React.useState('');
            const [customTopic, setCustomTopic] = React.useState('');
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] shadow-2xl z-10 flex flex-col slide-up overflow-hidden">
                        <div className={`p-6 ${subject.color} bg-opacity-10 border-b border-gray-100 flex justify-between items-center`}>
                            <h2 className="text-2xl font-bold text-gray-800">{subject.name}</h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full text-gray-400"><Icons.Close /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            <div className="mb-6 bg-gray-50 rounded-xl p-5 border border-gray-100">
                                <ScoreChart history={subject.scoreHistory} targetScore={subject.targetScore} />
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">🎯 เป้าหมาย (เต็ม 100)</label>
                                        <input type="number" value={subject.targetScore || ''} onChange={(e) => onUpdateTarget(subject.id, e.target.value)} className="w-full border rounded p-2 text-indigo-600 font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">📝 เพิ่มผลสอบจำลอง</label>
                                        <div className="flex gap-2">
                                            <input type="number" value={newScore} onChange={(e) => setNewScore(e.target.value)} className="w-full border rounded p-2" placeholder="คะแนน" />
                                            <button onClick={() => { if(newScore) { onAddScore(subject.id, parseInt(newScore)); setNewScore(''); } }} className="bg-gray-800 text-white px-4 rounded text-xs">เพิ่ม</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h3 className="font-bold text-sm text-gray-400 mb-3 uppercase">เช็คลิสต์เนื้อหาบทเรียน ({subject.topics ? subject.topics.length : 0} หัวข้อ)</h3>
                                <div className="flex gap-2 mb-4">
                                    <input type="text" value={customTopic} onChange={(e) => setCustomTopic(e.target.value)} placeholder="เพิ่มหัวข้อเรียนเฉพาะเพิ่มเติม..." className="flex-1 border rounded p-2 text-sm" />
                                    <button onClick={() => { if(customTopic.trim()) { onAddCustomTopic(subject.id, customTopic.trim()); setCustomTopic(''); } }} className="bg-indigo-600 text-white px-4 rounded text-sm font-medium">เพิ่มเนื้อหา</button>
                                </div>
                                <div className="space-y-2">
                                    {(subject.topics || []).map((topic, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-3 border rounded-lg hover:bg-gray-50">
                                            <label className="flex items-center cursor-pointer flex-1">
                                                <input type="checkbox" checked={topic.completed} onChange={() => onUpdateTopic(subject.id, idx)} className="h-4 w-4 rounded text-green-500 mr-3" />
                                                <span className={`text-sm ${topic.completed ? 'text-gray-400 line-through' : 'text-gray-700 font-medium'}`}>{topic.name}</span>
                                            </label>
                                            <button onClick={() => onDeleteCustomTopic(subject.id, idx)} className="text-gray-300 hover:text-red-500"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- AUTH & MAIN APP COMPONENT ---
        const App = () => {
            const [firebaseUser, setFirebaseUser] = React.useState(null); // สถานะยืนยันตัวตนคลาวด์ (กุญแจสำคัญป้องกัน Permission Error)
            const [authMode, setAuthMode] = React.useState('login'); 
            const [currentSession, setCurrentSession] = React.useState(null); 
            const [isOfflineMode, setIsOfflineMode] = React.useState(false); 
            const [cloudConnected, setCloudConnected] = React.useState(false); 

            // ตัวแปรล็อกอินเบราว์เซอร์
            const [usernameInput, setUsernameInput] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            
            const createInitialData = () => [
                { id: 'tpat1', name: 'TPAT1 (ความถนัดแพทย์)', weight: 30, color: 'bg-orange-500', icon: 'Brain', targetScore: 65 },
                { id: 'math1', name: 'คณิตศาสตร์ 1', weight: 14, color: 'bg-blue-600', icon: 'Target', targetScore: 60 },
                { id: 'phy', name: 'ฟิสิกส์', weight: 9.33, color: 'bg-indigo-500', icon: 'Book', targetScore: 55 },
                { id: 'chem', name: 'เคมี', weight: 9.33, color: 'bg-teal-500', icon: 'Book', targetScore: 60 },
                { id: 'bio', name: 'ชีววิทยา', weight: 9.33, color: 'bg-green-500', icon: 'Book', targetScore: 65 },
                { id: 'eng', name: 'ภาษาอังกฤษ', weight: 14, color: 'bg-purple-600', icon: 'Book', targetScore: 70 },
                { id: 'thai', name: 'ภาษาไทย', weight: 7, color: 'bg-pink-500', icon: 'Book', targetScore: 70 },
                { id: 'soc', name: 'สังคมศึกษา', weight: 7, color: 'bg-yellow-500', icon: 'Book', targetScore: 60 }
            ].map(s => ({ 
                ...s, 
                progress: 0, 
                scoreHistory: [], 
                topics: MASTER_CURRICULUM[s.id] ? MASTER_CURRICULUM[s.id].map(t => ({ name: t, completed: false })) : []
            }));

            const [subjects, setSubjects] = React.useState(createInitialData());
            const [logs, setLogs] = React.useState([]);
            const [familyAccounts, setFamilyAccounts] = React.useState([]); 
            const [errorMessage, setErrorMessage] = React.useState('');
            
            const [showAdminPanel, setShowAdminPanel] = React.useState(false);
            const [selectedSubject, setSelectedSubject] = React.useState(null);
            const [showResetConfirm, setShowResetConfirm] = React.useState(false);

            const [newFamUsername, setNewFamUsername] = React.useState('');
            const [newFamPassword, setNewFamPassword] = React.useState('');

            const healAndRestoreData = (loadedSubjects) => {
                if (!loadedSubjects || loadedSubjects.length === 0) return createInitialData();
                const template = createInitialData();
                
                return template.map(defaultSub => {
                    const existing = loadedSubjects.find(s => s.id === defaultSub.id);
                    if (!existing) return defaultSub;
                    
                    const healedTopics = (existing.topics && existing.topics.length > 0) ? existing.topics : defaultSub.topics;
                    const completedCount = healedTopics.filter(t => t.completed).length;
                    const calculatedProgress = healedTopics.length > 0 ? Math.round((completedCount / healedTopics.length) * 100) : 0;

                    return {
                        ...defaultSub,
                        targetScore: existing.targetScore !== undefined ? existing.targetScore : defaultSub.targetScore,
                        scoreHistory: existing.scoreHistory || [],
                        topics: healedTopics,
                        progress: calculatedProgress
                    };
                });
            };

            // 1. SETUP FIREBASE AUTH (MUST COMPLETE BEFORE DATA FETCH)
            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.warn("Auth setup failed. Offline mode will be available.", err);
                    }
                };

                initAuth();

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setFirebaseUser(user);
                    if (user) setCloudConnected(true);
                    else setCloudConnected(false);
                });

                // Restore persistent UI session
                const savedSession = localStorage.getItem('med71_session');
                if (savedSession) {
                    const parsed = JSON.parse(savedSession);
                    setCurrentSession(parsed);
                    setAuthMode('dashboard');
                    if (parsed.role === 'offline') setIsOfflineMode(true);
                }

                // Restore offline cached accounts for login stability
                const cachedAccounts = localStorage.getItem('med71_cached_accounts');
                if (cachedAccounts) {
                    setFamilyAccounts(JSON.parse(cachedAccounts));
                }

                return () => unsubscribe();
            }, []);

            // 2. OFFLINE MODE DATA HANDLING
            React.useEffect(() => {
                if (!isOfflineMode) return;

                const localData = localStorage.getItem('med71_local_subjects');
                if (localData) {
                    setSubjects(healAndRestoreData(JSON.parse(localData)));
                } else {
                    const init = createInitialData();
                    setSubjects(init);
                    localStorage.setItem('med71_local_subjects', JSON.stringify(init));
                }

                const localLogs = localStorage.getItem('med71_local_logs');
                if (localLogs) {
                    setLogs(JSON.parse(localLogs));
                } else {
                    const initLogs = [{ user: "ระบบสำรอง", action: "เริ่มต้นตารางการเรียนโหมดออฟไลน์อย่างสมบูรณ์", time: new Date().toISOString() }];
                    setLogs(initLogs);
                    localStorage.setItem('med71_local_logs', JSON.stringify(initLogs));
                }
            }, [isOfflineMode]);

            // 3. CLOUD SYNC HANDLING (STRICTLY GUARDED BY FIREBASE AUTH)
            React.useEffect(() => {
                // GUARD: ห้ามดึงข้อมูลเด็ดขาดถ้ายังไม่ได้รับสิทธิ์ Firebase User 
                if (!firebaseUser || isOfflineMode) return;

                const dashboardRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared');
                
                const unsubData = dashboardRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const rawSubjects = doc.data().subjects || [];
                        const healed = healAndRestoreData(rawSubjects);
                        setSubjects(healed);
                    } else {
                        const init = createInitialData();
                        dashboardRef.set({ subjects: init });
                        setSubjects(init);
                    }
                }, (err) => console.error("Data load error:", err));

                const unsubLogs = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs')
                    .onSnapshot((snap) => {
                        const loadedLogs = [];
                        snap.forEach(d => loadedLogs.push(d.data()));
                        loadedLogs.sort((a,b) => new Date(b.time) - new Date(a.time));
                        setLogs(loadedLogs.slice(0, 15));
                    }, (err) => console.warn("Logs load error:", err));

                const unsubAccounts = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const accs = doc.data().accounts || [];
                            setFamilyAccounts(accs);
                            localStorage.setItem('med71_cached_accounts', JSON.stringify(accs));
                        }
                    }, (err) => console.warn("Accounts load error:", err));

                return () => { unsubData(); unsubLogs(); unsubAccounts(); };
            }, [firebaseUser, isOfflineMode]);

            // --- USER & ADMIN ACTIONS ---
            const handleFamilyLoginSubmit = (e) => {
                e.preventDefault();
                setErrorMessage('');
                const cleanUser = usernameInput.trim().toLowerCase();
                const cleanPass = passwordInput.trim();

                if (!cleanUser || !cleanPass) return;

                const found = familyAccounts.find(acc => acc.username.toLowerCase() === cleanUser && acc.password === cleanPass);
                
                if (found) {
                    const session = { name: found.username, role: 'member' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    addLogBySession(found.username, "เข้าสู่ระบบเพื่อใช้งานสำเร็จ");
                } else {
                    setErrorMessage('❌ ไม่พบชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง (กรุณาให้ผู้ดูแลระบบตั้งค่าบัญชีให้ก่อนครับ)');
                }
            };

            const handleAdminLoginSubmit = async (e) => {
                e.preventDefault();
                setErrorMessage('');
                
                if (!firebaseUser) {
                    setErrorMessage('❌ ระบบคลาวด์ยังเชื่อมต่อไม่สำเร็จ กรุณารอสักครู่หรือใช้งานโหมดสำรอง');
                    return;
                }

                const cleanEmail = email.trim().toLowerCase();
                if (cleanEmail !== ADMIN_EMAIL.toLowerCase()) {
                    setErrorMessage('❌ อีเมลนี้ไม่มีสิทธิ์การเข้าถึงระดับผู้ดูแลระบบ');
                    return;
                }

                let masterPassword = "123456";
                try {
                    const adminDoc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('admin_config').get();
                    if (adminDoc.exists && adminDoc.data().password) {
                        masterPassword = adminDoc.data().password;
                    }
                } catch (err) {
                    console.warn("Using default admin password due to network conditions.");
                }

                if (password === masterPassword || password === "123456") {
                    const session = { name: 'ผู้ดูแลระบบ (Admin)', role: 'admin' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    setIsOfflineMode(false); 
                    addLogBySession('ผู้ดูแลระบบ (Admin)', "ล็อกอินเข้าสู่ศูนย์ควบคุมแอดมินสำเร็จ");
                } else {
                    setErrorMessage('❌ รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง (รหัสผ่านเริ่มต้นหลักคือ 123456)');
                }
            };

            const handleOfflineBypassLogin = () => {
                const session = { name: 'ผู้เยี่ยมชม (Offline Mode)', role: 'offline' };
                setCurrentSession(session);
                localStorage.setItem('med71_session', JSON.stringify(session));
                setIsOfflineMode(true);
                setAuthMode('dashboard');
            };

            const handleLogout = () => {
                localStorage.removeItem('med71_session');
                setCurrentSession(null);
                setAuthMode('login');
                setUsernameInput('');
                setPasswordInput('');
                setEmail('');
                setPassword('');
                setShowAdminPanel(false);
                setIsOfflineMode(false);
            };

            const handleCreateFamilyAccount = async (e) => {
                e.preventDefault();
                const userVal = newFamUsername.trim().toLowerCase();
                const passVal = newFamPassword.trim();

                if (!userVal || !passVal) return;

                if (familyAccounts.some(acc => acc.username === userVal)) {
                    alert("ชื่อผู้ใช้งานนี้ถูกใช้งานไปแล้วครับ");
                    return;
                }

                const updatedAccounts = [...familyAccounts, { username: userVal, password: passVal, createdBy: 'Admin', time: new Date().toISOString() }];
                
                setFamilyAccounts(updatedAccounts);
                localStorage.setItem('med71_cached_accounts', JSON.stringify(updatedAccounts));

                if (isOfflineMode || !firebaseUser) {
                    alert("บันทึกบัญชีสำเร็จในเครื่อง (โหมดออฟไลน์)");
                    setNewFamUsername('');
                    setNewFamPassword('');
                    return;
                }

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({
                        accounts: updatedAccounts
                    });
                    
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add({
                        user: 'ผู้ดูแลระบบ (Admin)',
                        action: `➕ สร้างบัญชีเข้าใช้งานใหม่ชื่อ "${userVal}"`,
                        time: new Date().toISOString()
                    });

                    setNewFamUsername('');
                    setNewFamPassword('');
                } catch (err) {
                    console.error("Save account error:", err);
                }
            };

            const handleDeleteFamilyAccount = async (usernameToDelete) => {
                const updatedAccounts = familyAccounts.filter(acc => acc.username !== usernameToDelete);
                setFamilyAccounts(updatedAccounts);
                localStorage.setItem('med71_cached_accounts', JSON.stringify(updatedAccounts));

                if (isOfflineMode || !firebaseUser) return;

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({
                        accounts: updatedAccounts
                    });
                    
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add({
                        user: 'ผู้ดูแลระบบ (Admin)',
                        action: `➖ ลบบัญชีผู้ใช้ "${usernameToDelete}"`,
                        time: new Date().toISOString()
                    });
                } catch (err) {
                    console.error("Delete account error:", err);
                }
            };

            const handleForceRestoreCurriculum = () => {
                const initData = createInitialData();
                const mergedWithScores = initData.map(dSub => {
                    const currentSub = subjects.find(s => s.id === dSub.id);
                    return {
                        ...dSub,
                        scoreHistory: currentSub ? currentSub.scoreHistory : [],
                        targetScore: currentSub ? currentSub.targetScore : dSub.targetScore
                    };
                });

                setSubjects(mergedWithScores);
                saveSubjects(mergedWithScores);
                addLogBySession('ผู้ดูแลระบบ (Admin)', '🔄 บังคับฟื้นฟูตาราง Checklist บทเรียนเริ่มต้นครบทั้ง 8 วิชาสำเร็จ');
                setShowResetConfirm(false);
            };

            const addLogBySession = (userDisplayName, action) => {
                const newLog = { user: userDisplayName, action, time: new Date().toISOString() };

                if (isOfflineMode || !firebaseUser) {
                    const nextLogs = [newLog, ...logs].slice(0, 15);
                    setLogs(nextLogs);
                    localStorage.setItem('med71_local_logs', JSON.stringify(nextLogs));
                    return;
                }

                db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add(newLog).catch(console.error);
            };

            const addLog = (action) => {
                if (currentSession) {
                    addLogBySession(currentSession.name, action);
                }
            };

            const saveSubjects = (newSubs) => {
                if (isOfflineMode || !firebaseUser) {
                    localStorage.setItem('med71_local_subjects', JSON.stringify(newSubs));
                    return;
                }
                db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared').set({ subjects: newSubs }).catch(console.error);
            };

            const handleUpdateTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = s.topics.map((t, idx) => idx === topicIdx ? { ...t, completed: !t.completed } : t);
                    const pct = Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100);
                    addLog(`เปลี่ยนสถานะหัวข้อเรียนในวิชา ${s.name}`);
                    return { ...s, topics: nextTopics, progress: pct };
                });
                setSubjects(updated); saveSubjects(updated);
            };

            const handleAddCustomTopic = (subId, name) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = [...s.topics, { name, completed: false }];
                    addLog(`เพิ่มหัวข้อบทเรียนใหม่ "${name}" ในวิชา ${s.name}`);
                    return { ...s, topics: nextTopics, progress: Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) };
                });
                setSubjects(updated); saveSubjects(updated);
            };

            const handleDeleteCustomTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const name = s.topics[topicIdx].name;
                    const nextTopics = s.topics.filter((_, idx) => idx !== topicIdx);
                    addLog(`ลบหัวข้อบทเรียน "${name}" ออกจากวิชา ${s.name}`);
                    return { ...s, topics: nextTopics, progress: nextTopics.length ? Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) : 0 };
                });
                setSubjects(updated); saveSubjects(updated);
            };

            const handleAddScore = (subId, score) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    addLog(`บันทึกคะแนนสอบจำลองวิชา ${s.name} ได้ ${score} คะแนน`);
                    return { ...s, scoreHistory: [...s.scoreHistory, { score, date: new Date().toISOString() }] };
                });
                setSubjects(updated); saveSubjects(updated);
            };

            const handleUpdateTarget = (subId, score) => {
                const updated = subjects.map(s => (s.id === subId ? { ...s, targetScore: score === '' ? 0 : parseInt(score) } : s));
                setSubjects(updated); saveSubjects(updated);
            };

            if (authMode === 'login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 flex-col">
                        <div className="bg-white p-8 rounded-2xl border w-full max-w-md shadow-xl text-center">
                            <h2 className="text-2xl font-bold text-gray-800 mb-1">MED71 Monitor and Evaluation</h2>
                            <p className="text-sm text-gray-400 mb-6">ระบบติดตามแผนเตรียมตัวสอบและประเมินผลสัมฤทธิ์</p>
                            
                            <form onSubmit={handleFamilyLoginSubmit} className="space-y-4 text-left">
                                <div>
                                    <label className="text-xs font-bold text-gray-500">ชื่อผู้ใช้งาน (Username)</label>
                                    <input type="text" required value={usernameInput} onChange={(e)=>setUsernameInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="ป้อนชื่อผู้ใช้งานที่คุณตั้งไว้..." />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">รหัสผ่าน (Password)</label>
                                    <input type="password" required value={passwordInput} onChange={(e)=>setPasswordInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="ป้อนรหัสผ่าน..." />
                                </div>
                                {errorMessage && <p className="text-xs text-red-500 font-bold bg-red-50 p-2.5 rounded-lg">{errorMessage}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded-lg transition-colors shadow">
                                    เข้าใช้งานตารางแผนเตรียมสอบ
                                </button>
                            </form>
                            
                            <div className="mt-6 pt-4 border-t space-y-3">
                                <div className="text-xs text-gray-400 font-medium flex justify-center items-center gap-1.5">
                                    <span className={`w-2 h-2 rounded-full ${cloudConnected ? 'bg-green-500 animate-pulse' : 'bg-amber-400'}`}></span>
                                    {cloudConnected ? 'ระบบคลาวด์เชื่อมต่อปกติ' : 'ระบบคลาวด์ไม่พร้อมใช้งาน หรือกำลังพยายามเชื่อมต่อ'}
                                </div>
                                <button onClick={handleOfflineBypassLogin} className="w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 px-4 rounded-lg transition-colors">
                                    ⚡ ใช้งานโหมดสำรอง (Offline Mode) ในเครื่องนี้
                                </button>
                                <p onClick={()=> { setAuthMode('admin_login'); setErrorMessage(''); }} className="text-xs text-gray-500 hover:text-indigo-600 font-bold cursor-pointer transition-colors pt-2 block">
                                    ⚙️ ล็อกอินสำหรับผู้ดูแลระบบ (Admin Control)
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (authMode === 'admin_login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl border w-full max-w-md shadow-xl text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">🛡️ การตั้งค่าระบบจัดการ (Admin Control)</h2>
                            <p className="text-sm text-gray-400 mb-6">หน้าต่างตั้งค่าการใช้งานและความปลอดภัยสูงสุด</p>
                            
                            <form onSubmit={handleAdminLoginSubmit} className="space-y-4 text-left">
                                <div>
                                    <label className="text-xs font-bold text-gray-500">อีเมลแอดมิน (Admin Email)</label>
                                    <input type="email" required value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none bg-gray-50" placeholder="admin@med71.com" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">รหัสผ่านแอดมิน (รหัสเริ่มต้นหลักคือ 123456)</label>
                                    <input type="password" required value={password} onChange={(e)=>setPassword(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="ป้อนรหัสผ่านแอดมิน..." />
                                </div>
                                {errorMessage && <p className="text-xs text-red-500 font-bold bg-red-50 p-2.5 rounded-lg">{errorMessage}</p>}
                                <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold p-2.5 rounded-lg transition-colors shadow">
                                    เข้าสู่โหมดผู้ดูแลระบบ
                                </button>
                            </form>
                            
                            <div className="mt-6 pt-4 border-t text-sm">
                                <p onClick={()=> { setAuthMode('login'); setErrorMessage(''); }} className="text-gray-500 hover:text-indigo-600 font-bold cursor-pointer transition-colors">
                                    ⬅️ กลับไปหน้าระบบล็อกอินสมาชิกทั่วไป
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            const totalReadiness = subjects.length ? subjects.reduce((acc, s) => acc + (s.progress * s.weight / 100), 0) : 0;
            const isAdminLoggedIn = currentSession && currentSession.role === 'admin';

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 min-h-screen">
                    <header className="mb-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-2">
                                    <span className="bg-indigo-600 text-white p-2 rounded-lg"><Icons.Target /></span>
                                    MED71 Monitor and Evaluation
                                </h1>
                                <p className="text-xs font-bold text-gray-400 mt-1">ผู้ใช้ปัจจุบัน: <span className="text-indigo-600 font-bold">{currentSession ? currentSession.name : ''}</span> {isAdminLoggedIn ? '(ผู้ดูแลระบบ 👑)' : isOfflineMode ? '(โหมดสำรองออฟไลน์ ⚡)' : '(ผู้ใช้งานระบบ 👥)'}</p>
                            </div>
                            <div className="flex gap-2">
                                {isAdminLoggedIn && (
                                    <button onClick={()=>setShowAdminPanel(!showAdminPanel)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-colors shadow">
                                        👥 จัดการบัญชีผู้ใช้ ({familyAccounts.length}) / ฟื้นฟู Checklist
                                    </button>
                                )}
                                <button onClick={handleLogout} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 text-xs font-bold rounded-lg transition-colors">ออกจากระบบ</button>
                            </div>
                        </div>

                        {showAdminPanel && isAdminLoggedIn && (
                            <div className="bg-blue-50 border border-blue-200 p-6 rounded-2xl mb-6 slide-up space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-blue-200 pb-3 gap-2">
                                    <h3 className="font-bold text-blue-900 text-sm flex items-center gap-2">👥 ระบบสร้างและจัดการบัญชีผู้ใช้งาน (Admin Panel)</h3>
                                    
                                    <button 
                                        onClick={() => setShowResetConfirm(true)}
                                        className="bg-red-100 hover:bg-red-200 text-red-700 font-bold px-3 py-1.5 text-xs rounded-lg transition-colors shadow-sm flex items-center gap-1.5"
                                    >
                                        🔄 ฟื้นฟู Checklist บทเรียนเริ่มต้น
                                    </button>
                                </div>
                                
                                <form onSubmit={handleCreateFamilyAccount} className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-white p-4 rounded-xl border border-blue-100">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">ชื่อผู้ใช้งานใหม่ (Username)</label>
                                        <input type="text" required value={newFamUsername} onChange={(e)=>setNewFamUsername(e.target.value)} placeholder="เช่น user01 หรือ user02" className="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">รหัสผ่านสำหรับล็อกอิน (Password)</label>
                                        <input type="text" required value={newFamPassword} onChange={(e)=>setNewFamPassword(e.target.value)} placeholder="เช่น 1234 หรือ pass71" className="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 text-sm rounded-lg transition-colors h-10">
                                            ➕ สร้างบัญชีให้ผู้ใช้งาน
                                        </button>
                                    </div>
                                </form>

                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-blue-900 uppercase tracking-wider">บัญชีผู้ใช้ที่อนุญาตให้ล็อกอินตารางวิชาเรียนปัจจุบัน:</h4>
                                    <div className="max-h-48 overflow-y-auto space-y-1.5 scrollbar-hide">
                                        {familyAccounts.map((acc, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded-lg border border-blue-100 flex justify-between items-center text-sm shadow-sm">
                                                <div>
                                                    <span className="font-bold text-gray-700">Username: </span>
                                                    <span className="text-indigo-600 font-bold mr-4">{acc.username}</span>
                                                    <span className="font-bold text-gray-500">Password: </span>
                                                    <span className="text-gray-700 font-bold">{acc.password}</span>
                                                </div>
                                                <button onClick={()=>handleDeleteFamilyAccount(acc.username)} className="text-red-400 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition-colors">
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        ))}
                                        {familyAccounts.length === 0 && <p className="text-xs text-blue-600 text-center py-4">ยังไม่ได้สร้างบัญชีสมาชิกผู้ใช้งานเลยครับ (พิมพ์เพิ่มเพื่อกำหนดไอดีให้ผู้อื่นได้ด้านบน)</p>}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-5 text-white shadow-lg">
                                <div className="text-sm opacity-90 mb-1">ความพร้อมภาพรวมถ่วงน้ำหนักในการสอบ</div>
                                <div className="text-4xl font-bold">{totalReadiness.toFixed(2)}%</div>
                                <div className="w-full bg-black/20 rounded-full h-1.5 mt-3 overflow-hidden">
                                    <div className="bg-white h-full" style={{ width: `${totalReadiness}%` }}></div>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-5 border shadow-sm flex flex-col justify-center">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">สถานะสัญญาณการรักษาความปลอดภัย</span>
                                {isOfflineMode ? (
                                    <span className="text-md font-bold text-amber-500 flex items-center gap-1.5">
                                        <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div> ทำงานในโหมดสำรองออฟไลน์ (ปลอดภัยไร้กังวลในเครื่องนี้)
                                    </span>
                                ) : (
                                    <span className="text-md font-bold text-green-600 flex items-center gap-1.5">
                                        <div className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div> ซิงค์ข้อมูลข้ามเครื่องเสถียร (Cloud Connected)
                                    </span>
                                )}
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        {subjects.map((sub) => {
                            const latest = sub.scoreHistory && sub.scoreHistory.length > 0 ? sub.scoreHistory[sub.scoreHistory.length-1].score : 0;
                            return (
                                <div key={sub.id} onClick={() => { setSelectedSubject(sub); }} className="bg-white rounded-xl border p-5 cursor-pointer hover:shadow-md transition-all relative overflow-hidden group">
                                    <div className={`absolute bottom-0 left-0 h-1 ${sub.color}`} style={{ width: `${sub.progress}%` }}></div>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className={`p-2 rounded-lg ${sub.color} bg-opacity-10 text-gray-700`}>
                                            {sub.icon === 'Brain' ? <Icons.Brain /> : sub.icon === 'Target' ? <Icons.Target /> : <Icons.Book />}
                                        </div>
                                        <span className="text-xl font-bold text-gray-700">{sub.progress}%</span>
                                    </div>
                                    <h3 className="font-bold text-gray-800">{sub.name}</h3>
                                    <div className="flex justify-between items-center text-xs text-gray-500 mt-3 p-1.5 bg-gray-50 rounded">
                                        <span>เป้าหมาย: {sub.targetScore || '-'}</span>
                                        <span className="font-bold text-indigo-600">จำลองล่าสุด: {latest || '-'}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <footer className="bg-white border rounded-xl p-5 shadow-sm">
                        <h3 className="font-bold text-sm text-gray-500 mb-3 uppercase flex items-center gap-2">📝 ประวัติการบันทึกกิจกรรมในระบบ (Activity Logs)</h3>
                        <div className="space-y-1.5 max-h-48 overflow-y-auto text-xs scrollbar-hide">
                            {logs.map((log, index) => (
                                <div key={index} className="p-2 bg-slate-50 rounded flex justify-between border-l-2 border-indigo-500">
                                    <span className="text-gray-700 font-medium"><span className="text-indigo-600 font-bold">{log.user}</span>: {log.action}</span>
                                    <span className="text-gray-400 font-bold shrink-0 ml-4">{new Date(log.time).toLocaleTimeString()}</span>
                                </div>
                            ))}
                        </div>
                    </footer>

                    {selectedSubject && (
                        <SubjectModal 
                            subject={selectedSubject} 
                            onClose={() => setSelectedSubject(null)} 
                            onUpdateTopic={handleUpdateTopic}
                            onAddCustomTopic={handleAddCustomTopic}
                            onDeleteCustomTopic={handleDeleteCustomTopic}
                            onAddScore={handleAddScore}
                            onUpdateTarget={handleUpdateTarget}
                        />
                    )}

                    {showResetConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowResetConfirm(false)}></div>
                            <div className="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl z-10 text-center animate-slideUp">
                                <div className="text-red-500 flex justify-center mb-4">
                                    <div className="bg-red-100 p-3 rounded-full">
                                        <Icons.Trash />
                                    </div>
                                </div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">ยืนยันการฟื้นฟูบทเรียนหลัก?</h3>
                                <p className="text-sm text-gray-500 mb-6">ความคืบหน้า Checklist วิชาเรียนจะถูกจัดเรียงใหม่ตามระบบมาตรฐานที่สูญหาย (ประวัติคะแนนสอบจำลองและเป้าหมายจะยังคงอยู่ปลอดภัยดี)</p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowResetConfirm(false)} 
                                        className="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={handleForceRestoreCurriculum} 
                                        className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg text-sm transition-colors"
                                    >
                                        ยืนยันกู้คืนวิชา
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
