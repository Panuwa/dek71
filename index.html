            soc: ["ศาสนา ศีลธรรม จริยธรรม", "หน้าที่พลเมือง", "เศรษฐศาสตร์", "ประวัติศาสตร์", "ภูมิศาสตร์"]

        const Icons = {
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v6a5 5 0 1 1-10 0V4"/><line x1="7" y1="9" x2="17" y2="9"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        const ScoreChart = ({ history, targetScore }) => {
            if (!history || history.length < 2) return (
                <div className="flex flex-col items-center justify-center h-32 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-gray-400 text-xs">
                    <Icons.Trophy />
                    <span className="mt-2 text-center">บันทึกคะแนนสอบอย่างน้อย 2 ครั้งเพื่อดูแนวโน้ม</span>
                </div>
            );
            const height = 120; const width = 500; const padding = 20; const maxScore = 100;
            const xStep = (width - padding * 2) / (history.length - 1);
            const points = history.map((entry, idx) => `${padding + idx * xStep},${height - padding - (entry.score / maxScore) * (height - padding * 2)}`).join(' ');
            const targetY = height - padding - (targetScore / maxScore) * (height - padding * 2);
            return (
                <div className="w-full overflow-hidden mb-6">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full bg-white rounded-lg border border-gray-100 shadow-sm">
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="#e5e7eb" />
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="#e5e7eb" strokeDasharray="4" />
                        {targetScore > 0 && <line x1={padding} y1={targetY} x2={width-padding} y2={targetY} stroke="#10b981" strokeDasharray="4" opacity="0.5" />}
                        <polyline points={points} fill="none" stroke="#4f46e5" strokeWidth="2" />
                        {history.map((entry, idx) => (
                            <g key={idx}>
                                <circle cx={padding + idx * xStep} cy={height - padding - (entry.score / maxScore) * (height - padding * 2)} r="4" fill="#fff" stroke="#4f46e5" strokeWidth="2" />
                                <text x={padding + idx * xStep} y={height - padding - (entry.score / maxScore) * (height - padding * 2) - 10} textAnchor="middle" fontSize="10" fill="#6b7280">{entry.score}</text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        const SubjectModal = ({ subject, onClose, onUpdateTopic, onAddCustomTopic, onDeleteCustomTopic, onAddScore, onUpdateTarget }) => {
            if (!subject) return null;
            const [newScore, setNewScore] = React.useState('');
            const [customTopic, setCustomTopic] = React.useState('');
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] shadow-2xl z-10 flex flex-col slide-up overflow-hidden">
                        <div className={`p-6 ${subject.color} bg-opacity-10 border-b border-gray-100 flex justify-between items-center`}>
                            <h2 className="text-2xl font-bold text-gray-800">{subject.name} <span className="text-sm font-normal text-gray-500 ml-2">(น้ำหนัก {subject.weight}%)</span></h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full text-gray-400"><Icons.Close /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            <div className="mb-6 bg-gray-50 rounded-xl p-5 border border-gray-100">
                                <ScoreChart history={subject.scoreHistory} targetScore={subject.targetScore} />
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">🎯 เป้าหมาย (เต็ม 100)</label>
                                        <input type="number" value={subject.targetScore || ''} onChange={(e) => onUpdateTarget(subject.id, e.target.value)} className="w-full border rounded p-2 text-indigo-600 font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">📝 เพิ่มผลสอบจำลอง</label>
                                        <div className="flex gap-2">
                                            <input type="number" value={newScore} onChange={(e) => setNewScore(e.target.value)} className="w-full border rounded p-2" placeholder="คะแนน" />
                                            <button onClick={() => { if(newScore) { onAddScore(subject.id, parseInt(newScore)); setNewScore(''); } }} className="bg-gray-800 text-white px-4 rounded text-xs">เพิ่ม</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h3 className="font-bold text-sm text-gray-400 mb-3 uppercase">เช็คลิสต์เนื้อหาบทเรียน</h3>
                                <div className="flex gap-2 mb-4">
                                    <input type="text" value={customTopic} onChange={(e) => setCustomTopic(e.target.value)} placeholder="เพิ่มหัวข้อเรียน..." className="flex-1 border rounded p-2 text-sm" />
                                    <button onClick={() => { if(customTopic.trim()) { onAddCustomTopic(subject.id, customTopic.trim()); setCustomTopic(''); } }} className="bg-indigo-600 text-white px-4 rounded text-sm font-medium">เพิ่ม</button>
                                </div>
                                <div className="space-y-2">
                                    {(subject.topics || []).map((topic, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-3 border rounded-lg hover:bg-gray-50">
                                            <label className="flex items-center cursor-pointer flex-1">
                                                <input type="checkbox" checked={topic.completed} onChange={() => onUpdateTopic(subject.id, idx)} className="h-4 w-4 rounded text-green-500 mr-3" />
                                                <span className={`text-sm ${topic.completed ? 'text-gray-400 line-through' : 'text-gray-700 font-medium'}`}>{topic.name}</span>
                                            </label>
                                            <button onClick={() => onDeleteCustomTopic(subject.id, idx)} className="text-gray-300 hover:text-red-500"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [authMode, setAuthMode] = React.useState('login'); 
            const [currentSession, setCurrentSession] = React.useState(null); 
            
            // Login Inputs
            const [usernameInput, setUsernameInput] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [errorMessage, setErrorMessage] = React.useState('');
            
            const createInitialData = () => [
                { id: 'tpat1', name: 'TPAT1 (ความถนัดแพทย์)', weight: 30, color: 'bg-orange-500', icon: 'Brain', targetScore: 60 },
                { id: 'math1', name: 'คณิตศาสตร์ 1', weight: 14, color: 'bg-blue-600', icon: 'Target', targetScore: 50 },
                { id: 'phy', name: 'ฟิสิกส์', weight: 9.33, color: 'bg-indigo-500', icon: 'Book', targetScore: 50 },
                { id: 'chem', name: 'เคมี', weight: 9.33, color: 'bg-teal-500', icon: 'Book', targetScore: 50 },
                { id: 'bio', name: 'ชีววิทยา', weight: 9.33, color: 'bg-green-500', icon: 'Book', targetScore: 50 },
                { id: 'eng', name: 'ภาษาอังกฤษ', weight: 14, color: 'bg-purple-600', icon: 'Book', targetScore: 60 },
                { id: 'thai', name: 'ภาษาไทย', weight: 7, color: 'bg-pink-500', icon: 'Book', targetScore: 60 },
                { id: 'soc', name: 'สังคมศึกษา', weight: 7, color: 'bg-yellow-500', icon: 'Book', targetScore: 50 }
            ].map(s => ({ 
                ...s, 
                progress: 0, 
                scoreHistory: [], 
                topics: MASTER_CURRICULUM[s.id] ? MASTER_CURRICULUM[s.id].map(t => ({ name: t, completed: false })) : []
            }));

            // States
            const [subjects, setSubjects] = React.useState(createInitialData());
            const [logs, setLogs] = React.useState([]);
            const [familyAccounts, setFamilyAccounts] = React.useState([]); 
            
            // UI States
            const [showAdminPanel, setShowAdminPanel] = React.useState(false);
            const [selectedSubject, setSelectedSubject] = React.useState(null);

            // Admin Form
            const [newFamUsername, setNewFamUsername] = React.useState('');
            const [newFamPassword, setNewFamPassword] = React.useState('');

            // คำนวณคะแนนรวมตาม Weight แบบ กสพท
            const calculateWeightedScore = () => {
                let totalCurrent = 0;
                let totalTarget = 0;
                
                subjects.forEach(sub => {
                    const weightPct = sub.weight / 100;
                    // เป้าหมาย
                    totalTarget += (sub.targetScore || 0) * weightPct;
                    // ปัจจุบัน
                    const latestScore = sub.scoreHistory && sub.scoreHistory.length > 0 
                        ? sub.scoreHistory[sub.scoreHistory.length - 1].score 
                        : 0;
                    totalCurrent += latestScore * weightPct;
                });
                
                return { 
                    current: totalCurrent.toFixed(2), 
                    target: totalTarget.toFixed(2) 
                };
            };

            const weightedStats = calculateWeightedScore();

            React.useEffect(() => {
                auth.signInAnonymously().catch(e => console.warn("Anonymous auth failed", e));

                const savedSession = localStorage.getItem('med71_session');
                if (savedSession) {
                    setCurrentSession(JSON.parse(savedSession));
                    setAuthMode('dashboard');
                }
            }, []);

            React.useEffect(() => {
                if (authMode !== 'dashboard') return;

                const dashboardRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared');
                const unsubData = dashboardRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const loaded = doc.data().subjects || [];
                        if (loaded.length === 0) {
                            setSubjects(createInitialData());
                        } else {
                            setSubjects(loaded);
                        }
                    } else {
                        const init = createInitialData();
                        dashboardRef.set({ subjects: init });
                        setSubjects(init);
                    }
                });

                const unsubLogs = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs')
                    .onSnapshot((snap) => {
                        const l = [];
                        snap.forEach(d => l.push(d.data()));
                        setLogs(l.sort((a,b) => new Date(b.time) - new Date(a.time)).slice(0, 15));
                    });

                const unsubAccounts = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            setFamilyAccounts(doc.data().accounts || []);
                        }
                    });

                return () => { unsubData(); unsubLogs(); unsubAccounts(); };
            }, [authMode]);

            const addLogToCloud = async (user, action) => {
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add({
                        user, action, time: new Date().toISOString()
                    });
                } catch (e) { console.error("Log error", e); }
            };

            const saveSubjectsToCloud = async (newSubs) => {
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared').set({ subjects: newSubs });
                } catch (e) { console.error("Save error", e); }
            };

            const handleUpdateTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = s.topics.map((t, idx) => idx === topicIdx ? { ...t, completed: !t.completed } : t);
                    const pct = Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100);
                    return { ...s, topics: nextTopics, progress: pct };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `อัปเดตบทเรียนในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleAddCustomTopic = (subId, name) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = [...s.topics, { name, completed: false }];
                    return { ...s, topics: nextTopics, progress: Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `เพิ่มบทเรียนใหม่ในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleDeleteCustomTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = s.topics.filter((_, idx) => idx !== topicIdx);
                    return { ...s, topics: nextTopics, progress: nextTopics.length ? Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) : 0 };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `ลบบทเรียนในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleAddScore = (subId, score) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    return { ...s, scoreHistory: [...s.scoreHistory, { score, date: new Date().toISOString() }] };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `เพิ่มคะแนน ${score} ในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleUpdateTarget = (subId, score) => {
                const updated = subjects.map(s => (s.id === subId ? { ...s, targetScore: score === '' ? 0 : parseInt(score) } : s));
                setSubjects(updated); saveSubjectsToCloud(updated);
            };

            const handleUserLogin = (e) => {
                e.preventDefault();
                setErrorMessage('');
                const user = usernameInput.trim();
                const pass = passwordInput.trim();
                const found = familyAccounts.find(acc => acc.username === user && acc.password === pass);
                
                if (found) {
                    const session = { name: found.username, role: 'member' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    addLogToCloud(found.username, "เข้าสู่ระบบ");
                } else {
                    setErrorMessage('❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setErrorMessage('');
                if (email.trim() === ADMIN_EMAIL && password === ADMIN_PASS) {
                    const session = { name: 'ผู้ดูแลระบบ (Admin)', role: 'admin' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    addLogToCloud('ผู้ดูแลระบบ', "ล็อกอินเข้าส่วนควบคุมแอดมิน");
                } else {
                    setErrorMessage('❌ อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้อง');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('med71_session');
                setCurrentSession(null);
                setAuthMode('login');
                setUsernameInput(''); setPasswordInput('');
                setEmail(''); setPassword('');
                setShowAdminPanel(false);
            };

            const handleCreateAccount = async (e) => {
                e.preventDefault();
                const u = newFamUsername.trim(); const p = newFamPassword.trim();
                if (!u || !p) return;
                if (familyAccounts.some(acc => acc.username === u)) {
                    alert("ชื่อผู้ใช้งานซ้ำ"); return;
                }
                const updated = [...familyAccounts, { username: u, password: p }];
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({ accounts: updated });
                    addLogToCloud('ผู้ดูแลระบบ', `สร้างบัญชีผู้ใช้ใหม่: ${u}`);
                    setNewFamUsername(''); setNewFamPassword('');
                } catch(e) {}
            };

            const handleDeleteAccount = async (u) => {
                const updated = familyAccounts.filter(acc => acc.username !== u);
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({ accounts: updated });
                    addLogToCloud('ผู้ดูแลระบบ', `ลบบัญชีผู้ใช้: ${u}`);
                } catch(e) {}
            };

            if (authMode === 'login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl border w-full max-w-md shadow-xl text-center">
                            <h2 className="text-2xl font-bold text-gray-800 mb-1">MED71 Monitor</h2>
                            <p className="text-sm text-gray-400 mb-6">ระบบติดตามคะแนนและแผนเตรียมสอบ กสพท</p>
                            <form onSubmit={handleUserLogin} className="space-y-4 text-left">
                                <div>
                                    <label className="text-xs font-bold text-gray-500">ชื่อผู้ใช้งาน</label>
                                    <input type="text" value={usernameInput} onChange={e=>setUsernameInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 outline-none focus:ring-1 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">รหัสผ่าน</label>
                                    <input type="password" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 outline-none focus:ring-1 focus:ring-indigo-500" required />
                                </div>
                                {errorMessage && <p className="text-xs text-red-500 font-bold">{errorMessage}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded-lg">เข้าสู่ระบบ</button>
                            </form>
                            <div className="mt-6 pt-4 border-t">
                                <button onClick={() => {setAuthMode('admin_login'); setErrorMessage('');}} className="text-xs text-gray-500 hover:text-indigo-600 font-bold">⚙️ ล็อกอินสำหรับผู้ดูแลระบบ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (authMode === 'admin_login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl border w-full max-w-md shadow-xl text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-6">⚙️ Admin Login</h2>
                            <form onSubmit={handleAdminLogin} className="space-y-4 text-left">
                                <div>
                                    <label className="text-xs font-bold text-gray-500">อีเมลแอดมิน</label>
                                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder={ADMIN_EMAIL} className="w-full border rounded-lg p-2.5 mt-1 outline-none" required />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">รหัสผ่านแอดมิน</label>
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 outline-none" required />
                                </div>
                                {errorMessage && <p className="text-xs text-red-500 font-bold">{errorMessage}</p>}
                                <button type="submit" className="w-full bg-slate-800 text-white font-bold p-2.5 rounded-lg">เข้าสู่โหมดผู้ดูแลระบบ</button>
                            </form>
                            <div className="mt-6 pt-4 border-t">
                                <button onClick={() => {setAuthMode('login'); setErrorMessage('');}} className="text-xs text-gray-500 font-bold">กลับไปหน้าล็อกอินปกติ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const isAdmin = currentSession && currentSession.role === 'admin';

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 min-h-screen">
                    <header className="mb-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-2">
                                    <span className="bg-indigo-600 text-white p-2 rounded-lg"><Icons.Target /></span>
                                    MED71 Monitor & Evaluation
                                </h1>
                                <p className="text-xs font-bold text-gray-400 mt-1">ผู้ใช้งาน: <span className="text-indigo-600">{currentSession?.name}</span></p>
                            </div>
                            <div className="flex gap-2">
                                {isAdmin && (
                                    <button onClick={()=>setShowAdminPanel(!showAdminPanel)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-xs font-bold rounded-lg shadow">
                                        จัดการบัญชีระบบ
                                    </button>
                                )}
                                <button onClick={handleLogout} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 text-xs font-bold rounded-lg">ออกจากระบบ</button>
                            </div>
                        </div>

                        {showAdminPanel && isAdmin && (
                            <div className="bg-blue-50 border border-blue-200 p-6 rounded-2xl mb-6 slide-up">
                                <h3 className="font-bold text-blue-900 mb-4 text-sm">👥 สร้างและจัดการบัญชีผู้ใช้งาน</h3>
                                <form onSubmit={handleCreateAccount} className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-white p-4 rounded-xl border border-blue-100 mb-4">
                                    <input type="text" placeholder="Username" value={newFamUsername} onChange={e=>setNewFamUsername(e.target.value)} className="border p-2 rounded text-sm" required />
                                    <input type="text" placeholder="Password" value={newFamPassword} onChange={e=>setNewFamPassword(e.target.value)} className="border p-2 rounded text-sm" required />
                                    <button type="submit" className="bg-blue-600 text-white rounded font-bold">สร้างบัญชี</button>
                                </form>
                                <div className="max-h-40 overflow-y-auto space-y-2">
                                    {familyAccounts.map((acc, i) => (
                                        <div key={i} className="bg-white p-2 px-4 rounded border flex justify-between items-center text-sm">
                                            <span><span className="font-bold text-gray-500">User:</span> {acc.username} <span className="font-bold text-gray-500 ml-4">Pass:</span> {acc.password}</span>
                                            <button onClick={()=>handleDeleteAccount(acc.username)} className="text-red-500"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* DASHBOARD CALCULATION SECTION */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                                <div className="text-sm opacity-90 mb-1">คะแนนรวม กสพท. คำนวณตามน้ำหนัก (ปัจจุบัน)</div>
                                <div className="text-4xl font-bold flex items-end gap-2">
                                    {weightedStats.current} <span className="text-lg opacity-70 mb-1">/ 100</span>
                                </div>
                                <div className="mt-4 pt-4 border-t border-white/20 text-sm">
                                    เป้าหมายที่ตั้งไว้: <strong>{weightedStats.target}</strong>
                                </div>
                                <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-4 translate-y-4">
                                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-2xl p-6 border shadow-sm flex flex-col justify-center">
                                <h3 className="text-sm font-bold text-gray-500 uppercase mb-3">น้ำหนักสัดส่วนคะแนน กสพท.</h3>
                                <div className="grid grid-cols-2 gap-x-4 gap-y-2 text-xs">
                                    <div className="flex justify-between border-b pb-1"><span>TPAT1 (ความถนัดแพทย์)</span><span className="font-bold text-indigo-600">30%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level คณิตศาสตร์ 1</span><span className="font-bold text-indigo-600">14%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level ภาษาอังกฤษ</span><span className="font-bold text-indigo-600">14%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level ฟิสิกส์</span><span className="font-bold text-indigo-600">9.33%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level เคมี</span><span className="font-bold text-indigo-600">9.33%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level ชีววิทยา</span><span className="font-bold text-indigo-600">9.33%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level ภาษาไทย</span><span className="font-bold text-indigo-600">7%</span></div>
                                    <div className="flex justify-between border-b pb-1"><span>A-Level สังคมศึกษา</span><span className="font-bold text-indigo-600">7%</span></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* SUBJECTS GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        {subjects.map((sub) => {
                            const latest = sub.scoreHistory && sub.scoreHistory.length > 0 ? sub.scoreHistory[sub.scoreHistory.length-1].score : 0;
                            const weightedContrib = (latest * (sub.weight / 100)).toFixed(2);
                            
                            return (
                                <div key={sub.id} onClick={() => setSelectedSubject(sub)} className="bg-white rounded-xl border p-5 cursor-pointer hover:shadow-md transition-all relative overflow-hidden group">
                                    <div className={`absolute bottom-0 left-0 h-1 ${sub.color}`} style={{ width: `${sub.progress}%` }}></div>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className={`p-2 rounded-lg ${sub.color} bg-opacity-10 text-gray-700`}>
                                            {sub.icon === 'Brain' ? <Icons.Brain /> : sub.icon === 'Target' ? <Icons.Target /> : <Icons.Book />}
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xs font-bold text-gray-400 block mb-1">เนื้อหา {sub.progress}%</span>
                                            <span className="text-xs font-bold bg-indigo-50 text-indigo-600 px-2 py-1 rounded">W: {sub.weight}%</span>
                                        </div>
                                    </div>
                                    <h3 className="font-bold text-gray-800 text-sm h-10">{sub.name}</h3>
                                    <div className="mt-3 pt-3 border-t grid grid-cols-2 gap-2 text-xs">
                                        <div className="bg-gray-50 p-2 rounded text-center">
                                            <span className="block text-gray-400">ล่าสุด</span>
                                            <span className="font-bold text-gray-700 text-sm">{latest || '-'}</span>
                                        </div>
                                        <div className="bg-indigo-50 p-2 rounded text-center">
                                            <span className="block text-indigo-400">คำนวณได้</span>
                                            <span className="font-bold text-indigo-700 text-sm">{weightedContrib}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* ACTIVITY LOGS */}
                    <footer className="bg-white border rounded-xl p-5 shadow-sm">
                        <h3 className="font-bold text-sm text-gray-500 mb-3 uppercase flex items-center gap-2">📝 ประวัติการบันทึกกิจกรรมในระบบ (Activity Logs)</h3>
                        <div className="space-y-1.5 max-h-48 overflow-y-auto text-xs scrollbar-hide">
                            {logs.map((log, index) => (
                                <div key={index} className="p-2 bg-slate-50 rounded flex justify-between border-l-2 border-indigo-500">
                                    <span className="text-gray-700 font-medium"><span className="text-indigo-600 font-bold">{log.user}</span>: {log.action}</span>
                                    <span className="text-gray-400 font-bold shrink-0 ml-4">{new Date(log.time).toLocaleTimeString()}</span>
                                </div>
                            ))}
                            {logs.length === 0 && <p className="text-center text-gray-400">ยังไม่มีประวัติกิจกรรม</p>}
                        </div>
                    </footer>

                    {/* MODAL */}
                    {selectedSubject && (
                        <SubjectModal 
                            subject={selectedSubject} 
                            onClose={() => setSelectedSubject(null)} 
                            onUpdateTopic={handleUpdateTopic}
                            onAddCustomTopic={handleAddCustomTopic}
                            onDeleteCustomTopic={handleDeleteCustomTopic}
                            onAddScore={handleAddScore}
                            onUpdateTarget={handleUpdateTarget}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
