<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED71 Monitor and Evaluation</title>
    
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f8fafc; }
        .scrollbar-hide::-scrollbar { display: none; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
          apiKey: "AIzaSyDXQ9TIM1NbyR-PJNbVO74Cf_1w3hDWuGM",
          authDomain: "dek71-8af86.firebaseapp.com",
          projectId: "dek71-8af86",
          storageBucket: "dek71-8af86.firebasestorage.app",
          messagingSenderId: "885325722595",
          appId: "1:885325722595:web:f79d36e1b78651217ea6d6",
          measurementId: "G-YDCNM0C1FR"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'med71-monitor-evaluation';

        const App = () => {
            const [subjects, setSubjects] = React.useState([]);
            const [logs, setLogs] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            // บังคับ Sync ข้อมูลทุกครั้งที่เปิดเครื่อง
            React.useEffect(() => {
                auth.signInAnonymously().then(() => {
                    // ดึงข้อมูลตารางเรียน
                    const dashboardRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    dashboardRef.onSnapshot((doc) => {
                        if (doc.exists && doc.data().subjects) {
                            setSubjects(doc.data().subjects);
                        }
                        setIsLoading(false);
                    });

                    // ดึง Logs
                    db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs')
                        .orderBy('time', 'desc')
                        .limit(10)
                        .onSnapshot(snap => {
                            const l = [];
                            snap.forEach(d => l.push(d.data()));
                            setLogs(l);
                        });
                });
            }, []);

            const updateCloudData = (newSubjects) => {
                setSubjects(newSubjects);
                db.collection('artifacts').doc(appId).collection('public').doc('data').set({ subjects: newSubjects }, { merge: true });
                db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add({
                    user: 'ผู้ใช้งาน',
                    action: 'มีการอัปเดตข้อมูลตารางเรียน',
                    time: new Date().toISOString()
                });
            };

            const stats = {
                raw: subjects.reduce((acc, s) => acc + (s.scoreHistory?.length > 0 ? s.scoreHistory[s.scoreHistory.length-1].score : 0), 0),
                max: subjects.length * 100
            };

            if (isLoading) return <div className="flex justify-center p-20 font-bold text-gray-500">กำลังเชื่อมต่อฐานข้อมูล...</div>;

            return (
                <div className="max-w-4xl mx-auto p-4 space-y-6">
                    <h1 className="text-2xl font-bold">MED71 Monitor and Evaluation</h1>
                    
                    {/* Dashboard กลาง */}
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-blue-600 text-white p-4 rounded-lg shadow">
                            <p className="text-xs opacity-80">คะแนนรวมทั้งหมด</p>
                            <p className="text-2xl font-bold">{stats.raw} / {stats.max}</p>
                        </div>
                        <div className="bg-green-600 text-white p-4 rounded-lg shadow">
                            <p className="text-xs opacity-80">สถานะการเชื่อมต่อ</p>
                            <p className="text-lg font-bold">ซิงค์ข้อมูลเรียลไทม์</p>
                        </div>
                    </div>

                    {/* รายวิชา */}
                    <div className="grid grid-cols-1 gap-2">
                        {subjects.map(sub => (
                            <div key={sub.id} className="bg-white p-3 border rounded shadow-sm flex justify-between items-center">
                                <span className="font-bold">{sub.name}</span>
                                <div className="w-1/2 bg-gray-200 h-2 rounded-full overflow-hidden">
                                    <div className={`${sub.color} h-full`} style={{width: `${sub.progress || 0}%`}}></div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Logs */}
                    <div className="text-xs text-gray-400 bg-white p-4 rounded shadow border">
                        <h4 className="font-bold mb-2">ประวัติกิจกรรม:</h4>
                        {logs.map((log, i) => <div key={i}>{log.action} ({new Date(log.time).toLocaleTimeString()})</div>)}
                    </div>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
