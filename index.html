// ROADMAP COMPONENT — fully editable + Firestore
// ════════════════════════════════════════════════
const RoadmapTab = ({ isAdmin }) => {
  const [phases,   setPhases]   = React.useState(DEFAULT_PHASES);
  const [exams,    setExams]    = React.useState(DEFAULT_EXAMS);
  const [loading,  setLoading]  = React.useState(true);
  const [saving,   setSaving]   = React.useState(false);

  // UI state
  const [openPhase,   setOpenPhase]   = React.useState(1);
  const [editMode,    setEditMode]    = React.useState(false);   // admin edit toggle
  const [editPhaseId, setEditPhaseId] = React.useState(null);    // which phase modal is open
  const [editExams,   setEditExams]   = React.useState(false);   // exam timeline edit

  // Draft states (used inside modals)
  const [draftPhase,  setDraftPhase]  = React.useState(null);
  const [draftExams,  setDraftExams]  = React.useState([]);
  const [newSubject,  setNewSubject]  = React.useState({ icon:'📚', name:'', teacher:'', mode:'Online', day:'', costNum:0, free:false });
  const [newExam,     setNewExam]     = React.useState({ month:'', label:'', color:'#94a3b8' });

  const rdDoc = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('roadmap');

  // Load from Firestore
  React.useEffect(() => {
    const unsub = rdDoc().onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.phases?.length) setPhases(d.phases);
        if (d.exams?.length)  setExams(d.exams);
      }
      setLoading(false);
    }, () => setLoading(false));
    return () => unsub();
  }, []);

  const saveToFirestore = async (newPhases, newExams) => {
    setSaving(true);
    try { await rdDoc().set({ phases: newPhases, exams: newExams }); } catch(e) {}
    setSaving(false);
  };

  // ── Phase edit helpers ──
  const openPhaseEdit = (phase) => {
    setDraftPhase(JSON.parse(JSON.stringify(phase)));
    setEditPhaseId(phase.id);
  };
  const saveDraftPhase = async () => {
    const updated = phases.map(p => p.id === draftPhase.id ? draftPhase : p);
    setPhases(updated);
    await saveToFirestore(updated, exams);
    setEditPhaseId(null);
  };
  const updateDraftSubject = (si, field, val) => {
    const subs = draftPhase.subjects.map((s, i) => i === si ? { ...s, [field]: field === 'costNum' ? (parseInt(val)||0) : val, ...(field==='free'?{free:val}:{}) } : s);
    setDraftPhase({ ...draftPhase, subjects: subs });
  };
  const removeDraftSubject = (si) => setDraftPhase({ ...draftPhase, subjects: draftPhase.subjects.filter((_,i)=>i!==si) });
  const addDraftSubject = () => {
    if (!newSubject.name.trim()) return;
    setDraftPhase({ ...draftPhase, subjects: [...draftPhase.subjects, { ...newSubject }] });
    setNewSubject({ icon:'📚', name:'', teacher:'', mode:'Online', day:'', costNum:0, free:false });
  };

  // ── Exam edit helpers ──
  const openExamEdit = () => { setDraftExams(JSON.parse(JSON.stringify(exams))); setEditExams(true); };
  const saveExams = async () => {
    setExams(draftExams);
    await saveToFirestore(phases, draftExams);
    setEditExams(false);
  };
  const updateDraftExam = (ei, field, val) => setDraftExams(draftExams.map((e,i)=>i===ei?{...e,[field]:val}:e));
  const removeDraftExam = (ei) => setDraftExams(draftExams.filter((_,i)=>i!==ei));
  const addDraftExam = () => { if(!newExam.month.trim()||!newExam.label.trim()) return; setDraftExams([...draftExams,{...newExam}]); setNewExam({month:'',label:'',color:'#94a3b8'}); };

  const totalCost = phases.reduce((a, p) => a + (p.subjects||[]).reduce((s2, sub) => s2 + (sub.free ? 0 : (sub.costNum||0)), 0), 0);

  const inputCls = "bg-transparent border-b border-white/20 text-white text-xs outline-none py-1 w-full placeholder-white/30";
  const btnSave  = { background:'linear-gradient(135deg,#a78bfa,#f472b6)', color:'white' };
  const btnDel   = { background:'rgba(239,68,68,0.15)', color:'#f87171', border:'1px solid rgba(239,68,68,0.3)' };

  if (loading) return <div className="text-center py-20 text-sm" style={{color:'rgba(255,255,255,0.3)'}}>กำลังโหลด roadmap…</div>;

  return (
    <div className="space-y-6 slide-up">
      {/* Header */}
      <div className="glass rounded-2xl p-5" style={{background:'linear-gradient(135deg,rgba(167,139,250,0.08),rgba(244,114,182,0.05))'}}>
        <div className="flex flex-wrap gap-4 justify-between items-start">
          <div>
            <h2 className="text-base font-black text-white mb-1">🏥 Roadmap สอบเข้าหมอ DEK71</h2>
            <p className="text-xs" style={{color:'rgba(255,255,255,0.4)'}}>ม.5 เทอม 1 (มิ.ย. 69) → สอบ A-Level & TPAT1 (มี.ค. 71)</p>
          </div>
          <div className="flex items-center gap-3">
            {isAdmin && (
              <button onClick={()=>setEditMode(!editMode)} className="px-3 py-1.5 rounded-lg text-xs font-bold transition-all"
                style={editMode ? btnSave : {background:'rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.6)',border:'1px solid rgba(255,255,255,0.1)'}}>
                {editMode ? '✏️ กำลังแก้ไข' : '✏️ แก้ไข'}
              </button>
            )}
            {saving && <span className="text-xs" style={{color:'rgba(255,255,255,0.4)'}}>กำลังบันทึก…</span>}
            <div className="text-right">
              <p className="text-xs font-bold" style={{color:'rgba(255,255,255,0.4)'}}>งบรวม (ประมาณการ)</p>
              <p className="text-2xl font-black text-white">{totalCost.toLocaleString()} <span className="text-sm font-normal" style={{color:'rgba(255,255,255,0.4)'}}>฿</span></p>
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        {/* ── Left: Phases ── */}
        <div className="md:col-span-2 space-y-3">

// Reusable UI

const ProgressRing = ({ pct, size=56, stroke=5, color='#a78bfa' }) => {
  const r = (size - stroke*2) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct/100)*circ;
  return (
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth={stroke} />
      <circle className="progress-ring-circle" cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={circ} strokeDashoffset={offset} />
      <text x="50%" y="50%" textAnchor="middle" dy=".35em" fontSize={size*0.22} fill="white" fontWeight="700">{pct}%</text>
    </svg>
  );
};

const MiniChart = ({ history, target, color }) => {
  if (!history || history.length < 2) return (
    <div className="flex items-center justify-center h-16 text-xs" style={{color:'rgba(255,255,255,0.3)'}}>
      บันทึก 2 ครั้งขึ้นไปเพื่อดู trend
    </div>
  );
  const W=300, H=70, P=8;
  const max=100, min=0;
  const xS = (W-P*2)/(history.length-1);
  const yOf = s => H - P - ((s-min)/(max-min))*(H-P*2);
  const pts = history.map((e,i)=>`${P+i*xS},${yOf(e.score)}`).join(' ');
  const tY = yOf(target||0);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'70px'}}>
      {target>0 && <line x1={P} y1={tY} x2={W-P} y2={tY} stroke="rgba(255,255,255,0.2)" strokeDasharray="3" strokeWidth="1"/>}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
      {history.map((e,i)=>(
        <g key={i}>
          <circle cx={P+i*xS} cy={yOf(e.score)} r="3" fill={color} stroke="#0f0f1a" strokeWidth="1.5"/>
          <text x={P+i*xS} y={yOf(e.score)-7} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,0.6)">{e.score}</text>
        </g>
      ))}
    </svg>
  );
};

const App = () => {
  const [authMode, setAuthMode] = React.useState('login');
  const [currentSession, setCurrentSession] = React.useState(null);
  const [isAuthReady, setIsAuthReady] = React.useState(false);

  const [usernameInput, setUsernameInput] = React.useState('');
  const [passwordInput, setPasswordInput] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [errMsg, setErrMsg] = React.useState('');

  const [subjects, setSubjects] = React.useState([]);
  const [logs, setLogs] = React.useState([]);
  const [familyAccounts, setFamilyAccounts] = React.useState([]);
  const [weeklyPlan, setWeeklyPlan] = React.useState({ mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[] });
  const [streak, setStreak] = React.useState({ current:0, longest:0, lastDate:'' });

  const [selectedSubjectId, setSelectedSubjectId] = React.useState(null);

  const [activeTab, setActiveTab] = React.useState('dashboard');

  const selectedSubject = selectedSubjectId ? subjects.find(s=>s.id===selectedSubjectId) : null;

  const showToast = (msg, type='error') => { setToast({msg,type}); setTimeout(()=>setToast(null),4000); };

  const createInitialData = () => [

    { id:'math1', name:'คณิตศาสตร์ 1',           weight:14,   targetScore:50 },
    { id:'phy',   name:'ฟิสิกส์',                weight:9.33, targetScore:50 },
    { id:'chem',  name:'เคมี',                   weight:9.33, targetScore:50 },
    { id:'bio',   name:'ชีววิทยา',               weight:9.33, targetScore:50 },
    { id:'eng',   name:'ภาษาอังกฤษ',             weight:14,   targetScore:60 },
    { id:'thai',  name:'ภาษาไทย',                weight:7,    targetScore:60 },
    { id:'soc',   name:'สังคมศึกษา',             weight:7,    targetScore:50 },
  ].map(s=>({ ...s, progress:0, scoreHistory:[], topics:(MASTER_CURRICULUM[s.id]||[]).map(t=>({name:t,completed:false})) }));

  React.useEffect(()=>{
    const unsub = auth.onAuthStateChanged(u=>{
      if(u) setIsAuthReady(true);

    });
    const saved = localStorage.getItem('med71_session');
    if(saved){ setCurrentSession(JSON.parse(saved)); setAuthMode('dashboard'); }
    return ()=>unsub();
  },[]);

  React.useEffect(()=>{
    if(authMode!=='dashboard'||!isAuthReady) return;
    const base = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data');
    const u1 = base.doc('dashboard_shared').onSnapshot(doc=>{
      if(doc.exists){
        const loaded=doc.data().subjects||[];
        if(!loaded.length){ setSubjects(createInitialData()); return; }
        setSubjects(loaded.map(ls=>({...ls,topics:ls.topics?.length?ls.topics:(createInitialData().find(s=>s.id===ls.id)?.topics||[])})));
      } else { const init=createInitialData(); base.doc('dashboard_shared').set({subjects:init}); setSubjects(init); }
    }, e=>showToast('โหลดข้อมูลไม่ได้: '+e.message));
    const u2 = base.doc('weekly_plan').onSnapshot(doc=>{ if(doc.exists) setWeeklyPlan(doc.data().plan||{}); },()=>{});
    const u3 = base.doc('streak').onSnapshot(doc=>{ if(doc.exists) setStreak(doc.data()); },()=>{});
    const u4 = base.doc('family_accounts').onSnapshot(doc=>{ if(doc.exists) setFamilyAccounts(doc.data().accounts||[]); },()=>{});
    const u5 = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs')
      .onSnapshot(snap=>{ const l=[]; snap.forEach(d=>l.push({id:d.id,...d.data()})); setLogs(l.sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,20)); },()=>{});
    return ()=>{ u1(); u2(); u3(); u4(); u5(); };
  },[authMode,isAuthReady]);

  const save = async (newSubs) => {
    if(!isAuthReady) return;
    try {

      const today=new Date().toDateString();
      const last=streak.lastDate;
      const isConsec=last===new Date(Date.now()-86400000).toDateString();
      const newCur=last===today?streak.current:(isConsec?streak.current+1:1);
      const newStreak={current:newCur,longest:Math.max(newCur,streak.longest||0),lastDate:today};
      await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('streak').set(newStreak);
      setStreak(newStreak);
    } catch(e) { showToast(e.code==='permission-denied'?'❌ Firestore Rules ไม่อนุญาต':'❌ บันทึกไม่สำเร็จ: '+e.message); }

  const addLog = async (user,action) => {

  const handleAddCustomTopic=(subId,name)=>{const updated=subjects.map(s=>{if(s.id!==subId)return s;const t=[...s.topics,{name,completed:false}];return{...s,topics:t,progress:Math.round(t.filter(x=>x.completed).length/t.length*100)};});setSubjects(updated);save(updated);};
  const handleDeleteCustomTopic=(subId,idx)=>{const updated=subjects.map(s=>{if(s.id!==subId)return s;const t=s.topics.filter((_,i)=>i!==idx);return{...s,topics:t,progress:t.length?Math.round(t.filter(x=>x.completed).length/t.length*100):0};});setSubjects(updated);save(updated);};
  const handleAddScore=(subId,score)=>{const updated=subjects.map(s=>s.id!==subId?s:{...s,scoreHistory:[...(s.scoreHistory||[]),{score,date:new Date().toISOString()}]});setSubjects(updated);save(updated);addLog(currentSession.name,`บันทึก mock ${score} วิชา ${subjects.find(s=>s.id===subId).name}`);};
  const handleUpdateTarget=(subId,val)=>{const updated=subjects.map(s=>s.id!==subId?s:{...s,targetScore:val===''?0:parseInt(val)});setSubjects(updated);save(updated);};
  const toggleWeeklySubject=(dayKey,subId)=>{const cur=weeklyPlan[dayKey]||[];const next=cur.includes(subId)?cur.filter(x=>x!==subId):[...cur,subId];const newPlan={...weeklyPlan,[dayKey]:next};setWeeklyPlan(newPlan);saveWeeklyPlan(newPlan);};

  const weightedScore=subjects.reduce((acc,s)=>{const lat=s.scoreHistory?.length?s.scoreHistory[s.scoreHistory.length-1].score:0;return acc+lat*(s.weight/100);},0);

        <div className="glass rounded-2xl p-6">

  const isAdmin = currentSession?.role==='admin';

  // ── Tab definitions: เพิ่ม roadmap ──
  const TABS_DESKTOP = [['dashboard','📊 Overview'],['analytics','📈 Analytics'],['weekly','📅 Weekly'],['roadmap','🗺️ Roadmap'],['logs','📋 Logs']];
  const TABS_MOBILE  = [['dashboard','📊'],['analytics','📈'],['weekly','📅'],['roadmap','🗺️'],['logs','📋']];

  return (
    <div className="min-h-screen" style={{background:'#0f0f1a'}}>
      {toast && <div className={`toast rounded-xl px-4 py-3 text-sm font-bold text-white shadow-2xl ${toast.type==='error'?'bg-red-600':'bg-emerald-600'}`}>{toast.msg}</div>}

      {/* Top Nav */}
      <nav className="sticky top-0 z-40 flex items-center justify-between px-4 py-3" style={{background:'rgba(15,15,26,0.85)',backdropFilter:'blur(16px)',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>

              <input value={newFamU} onChange={e=>setNewFamU(e.target.value)} placeholder="Username" required className="flex-1 min-w-32 rounded-xl px-3 py-2 text-sm text-white outline-none" style={{background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)'}}/>

            <div className="space-y-2">
              {familyAccounts.map((acc,i)=>(
                <div key={i} className="flex justify-between items-center px-4 py-2.5 rounded-xl text-sm" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)'}}>
                  <span className="text-white font-bold">{acc.username} <span className="font-normal" style={{color:'rgba(255,255,255,0.4)'}}>/ {acc.password}</span></span>
                  <button onClick={async()=>{const up=familyAccounts.filter(a=>a.username!==acc.username);setFamilyAccounts(up);try{await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({accounts:up});}catch(e){}}} className="text-red-400 text-xs hover:text-red-300">ลบ</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ══════════ DASHBOARD ══════════ */}
        {activeTab==='dashboard' && (
          <div className="space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="glass rounded-2xl p-4 flex flex-col gap-2" style={{border:'1px solid rgba(251,191,36,0.2)',background:'rgba(251,191,36,0.05)'}}>
                <div className="flex items-center justify-between"><span className="text-xs font-bold" style={{color:'rgba(251,191,36,0.7)'}}>🔥 STREAK</span>{streak.current>=3&&<span className="pulse-ring rounded-full w-2 h-2 bg-yellow-400"/>}</div>
                <div className="text-4xl font-black text-white">{streak.current}<span className="text-sm font-normal ml-1" style={{color:'rgba(255,255,255,0.4)'}}>วัน</span></div>
                <div className="text-xs" style={{color:'rgba(255,255,255,0.4)'}}>สูงสุด {streak.longest||0} วัน</div>
              </div>
              <div className="glass rounded-2xl p-4 flex flex-col gap-2" style={{border:'1px solid rgba(167,139,250,0.2)',background:'rgba(167,139,250,0.05)'}}>
                <span className="text-xs font-bold" style={{color:'rgba(167,139,250,0.7)'}}>⚖️ คะแนน กสพท.</span>
                <div className="text-4xl font-black text-white">{weightedScore.toFixed(1)}<span className="text-sm font-normal ml-1" style={{color:'rgba(255,255,255,0.4)'}}>/100</span></div>
                <div className="w-full rounded-full h-1.5 overflow-hidden" style={{background:'rgba(255,255,255,0.08)'}}><div className="h-full rounded-full transition-all" style={{width:`${Math.min(weightedScore,100)}%`,background:'linear-gradient(90deg,#a78bfa,#f472b6)'}}/></div>
              </div>
              <div className="glass rounded-2xl p-4 flex flex-col gap-2" style={{border:'1px solid rgba(34,197,94,0.2)',background:'rgba(34,197,94,0.05)'}}>
                <span className="text-xs font-bold" style={{color:'rgba(34,197,94,0.7)'}}>📚 เนื้อหาครบ</span>
                <div className="text-4xl font-black text-white">{avgProgress.toFixed(0)}<span className="text-sm font-normal ml-1" style={{color:'rgba(255,255,255,0.4)'}}>%</span></div>
                <div className="w-full rounded-full h-1.5 overflow-hidden" style={{background:'rgba(255,255,255,0.08)'}}><div className="h-full rounded-full transition-all" style={{width:`${avgProgress}%`,background:'linear-gradient(90deg,#22c55e,#10b981)'}}/></div>
              </div>
              <div className="glass rounded-2xl p-4 flex flex-col gap-2" style={{border:'1px solid rgba(96,165,250,0.2)',background:'rgba(96,165,250,0.05)'}}>
                <span className="text-xs font-bold" style={{color:'rgba(96,165,250,0.7)'}}>🏅 BADGES</span>
                <div className="text-4xl font-black text-white">{earnedBadges.length}<span className="text-sm font-normal ml-1" style={{color:'rgba(255,255,255,0.4)'}}>/{BADGES.length}</span></div>
                <div className="flex gap-1 flex-wrap">{BADGES.map(b=>(<span key={b.id} className="text-lg" style={{opacity:earnedBadges.find(x=>x.id===b.id)?1:0.15}} title={b.label}>{b.emoji}</span>))}</div>
              </div>
            </div>
            <div>
              <h2 className="text-xs font-bold mb-3" style={{color:'rgba(255,255,255,0.4)'}}>วิชาทั้งหมด — คลิกเพื่อจัดการ</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {subjects.map(sub=>{
                  const col=SUB_COLORS[sub.id]||SUB_COLORS.soc;
                  const latest=sub.scoreHistory?.length?sub.scoreHistory[sub.scoreHistory.length-1].score:null;
                  const prev=sub.scoreHistory?.length>1?sub.scoreHistory[sub.scoreHistory.length-2].score:null;
                  const trend=latest!==null&&prev!==null?(latest>prev?'↑':latest<prev?'↓':'→'):'';
                  return (
                    <div key={sub.id} onClick={()=>setSelectedSubjectId(sub.id)} className="card-hover rounded-2xl overflow-hidden" style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)'}}>
                      <div className="h-1.5" style={{background:`linear-gradient(90deg,${col.from},${col.to})`}}/>
                      <div className="p-4">
                        <div className="flex justify-between items-start mb-3">
                          <ProgressRing pct={sub.progress} size={48} stroke={4} color={col.from}/>
                          <div className="text-right">
                            {latest!==null?<div className="text-xl font-black text-white">{latest}<span className="text-xs font-normal ml-0.5" style={{color:'rgba(255,255,255,0.4)'}}>/100</span></div>:<div className="text-xs mt-2" style={{color:'rgba(255,255,255,0.3)'}}>ยังไม่มีคะแนน</div>}
                            {trend&&<div className="text-sm font-bold" style={{color:trend==='↑'?'#4ade80':trend==='↓'?'#f87171':'#94a3b8'}}>{trend}</div>}
                          </div>
                        </div>
                        <p className="text-xs font-bold text-white leading-tight mb-1">{sub.name}</p>
                        <p className="text-xs" style={{color:'rgba(255,255,255,0.3)'}}>น้ำหนัก {sub.weight}%</p>
                        <div className="mt-2.5 flex items-center gap-1.5">
                          <div className="flex-1 h-1 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,0.08)'}}><div className="h-full rounded-full" style={{width:`${sub.progress}%`,background:`linear-gradient(90deg,${col.from},${col.to})`}}/></div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div>
              <h2 className="text-xs font-bold mb-3" style={{color:'rgba(255,255,255,0.4)'}}>ACHIEVEMENTS</h2>
              <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                {BADGES.map(b=>{const earned=!!earnedBadges.find(x=>x.id===b.id);return(<div key={b.id} className="glass rounded-xl p-3 text-center transition-all" style={{opacity:earned?1:0.35,border:earned?'1px solid rgba(251,191,36,0.3)':'1px solid rgba(255,255,255,0.05)',background:earned?'rgba(251,191,36,0.08)':'rgba(255,255,255,0.02)'}}><div className={`text-2xl mb-1 ${earned?'badge-glow':''}`}>{b.emoji}</div><p className="text-xs font-bold text-white">{b.label}</p><p className="text-[10px] mt-0.5" style={{color:'rgba(255,255,255,0.4)'}}>{b.desc}</p></div>);})}
              </div>
            </div>
          </div>
        )}

        {/* ══════════ ANALYTICS ══════════ */}
        {activeTab==='analytics' && (
          <div className="space-y-6">
            <h2 className="text-xs font-bold" style={{color:'rgba(255,255,255,0.4)'}}>MOCK TEST ANALYTICS — เปรียบเทียบทุกวิชา</h2>
            <div className="glass rounded-2xl p-5">
              <p className="text-xs font-bold mb-4" style={{color:'rgba(255,255,255,0.4)'}}>คะแนน Mock ล่าสุด vs เป้าหมาย</p>
              <div className="space-y-3">
                {subjects.map(sub=>{const col=SUB_COLORS[sub.id]||SUB_COLORS.soc;const latest=sub.scoreHistory?.length?sub.scoreHistory[sub.scoreHistory.length-1].score:0;const target=sub.targetScore||0;const pct=Math.min(latest,100);const tpct=Math.min(target,100);return(<div key={sub.id}><div className="flex justify-between items-center mb-1"><span className="text-xs font-bold text-white">{sub.name}</span><span className="text-xs font-bold" style={{color:latest>=target?'#4ade80':'rgba(255,255,255,0.5)'}}>{latest} <span style={{color:'rgba(255,255,255,0.3)'}}>/ {target}</span></span></div><div className="relative h-5 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,0.06)'}}><div className="absolute top-0 left-0 h-full rounded-full transition-all" style={{width:`${pct}%`,background:`linear-gradient(90deg,${col.from},${col.to})`}}/><div className="absolute top-0 h-full w-0.5 bg-white/30" style={{left:`${tpct}%`}}/></div></div>);})}
              </div>
              <p className="text-xs mt-3" style={{color:'rgba(255,255,255,0.3)'}}>เส้นสีขาวแนวตั้ง = เป้าหมาย</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {subjects.filter(s=>s.scoreHistory?.length>0).map(sub=>{const col=SUB_COLORS[sub.id]||SUB_COLORS.soc;return(<div key={sub.id} className="glass rounded-2xl p-4"><div className="flex justify-between items-center mb-3"><p className="text-sm font-bold text-white">{sub.name}</p><span className="text-xs px-2 py-0.5 rounded-full font-bold" style={{background:`${col.from}33`,color:col.from}}>{sub.scoreHistory.length} ครั้ง</span></div><MiniChart history={sub.scoreHistory} target={sub.targetScore} color={col.from}/></div>);})}
              {subjects.every(s=>!s.scoreHistory?.length)&&(<div className="col-span-2 text-center py-16" style={{color:'rgba(255,255,255,0.3)'}}><div className="text-5xl mb-3">📊</div><p>ยังไม่มีข้อมูล Mock Test กรุณากดที่วิชาและบันทึกคะแนนก่อน</p></div>)}
            </div>
          </div>
        )}

        {/* ══════════ WEEKLY ══════════ */}
        {activeTab==='weekly' && (
          <div className="space-y-5">
            <h2 className="text-xs font-bold" style={{color:'rgba(255,255,255,0.4)'}}>WEEKLY STUDY PLAN — คลิกเพื่อเพิ่ม/ลบวิชา</h2>
            <div className="grid grid-cols-7 gap-2">
              {DAY_KEYS.map((day,di)=>(
                <div key={day} className="glass rounded-2xl p-3 min-h-48" style={{border:'1px solid rgba(255,255,255,0.07)'}}>
                  <p className="text-xs font-black text-center mb-3" style={{color:'rgba(255,255,255,0.5)'}}>{DAYS[di]}</p>
                  <div className="space-y-1.5">
                    {subjects.map(sub=>{const col=SUB_COLORS[sub.id]||SUB_COLORS.soc;const active=(weeklyPlan[day]||[]).includes(sub.id);return(<button key={sub.id} onClick={()=>toggleWeeklySubject(day,sub.id)} className="day-btn w-full rounded-lg px-1.5 py-1 text-[10px] font-bold text-left leading-tight transition-all" style={active?{background:`linear-gradient(135deg,${col.from},${col.to})`,color:'white',border:'none'}:{background:'rgba(255,255,255,0.04)',color:'rgba(255,255,255,0.3)',border:'1px solid rgba(255,255,255,0.06)'}}>{sub.name.split(' ')[0]}</button>);})}
                  </div>
                </div>
              ))}
            </div>
            <div className="glass rounded-2xl p-4">
              <p className="text-xs font-bold mb-3" style={{color:'rgba(255,255,255,0.4)'}}>สรุปภาระงานรายวิชาต่อสัปดาห์</p>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {subjects.map(sub=>{const col=SUB_COLORS[sub.id]||SUB_COLORS.soc;const days=DAY_KEYS.filter(d=>(weeklyPlan[d]||[]).includes(sub.id));return(<div key={sub.id} className="rounded-xl p-3" style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)'}}><p className="text-xs font-bold text-white mb-1">{sub.name}</p><p className="text-lg font-black" style={{color:days.length?col.from:'rgba(255,255,255,0.2)'}}>{days.length} <span className="text-xs font-normal" style={{color:'rgba(255,255,255,0.4)'}}>วัน/สัปดาห์</span></p><p className="text-[10px] mt-1" style={{color:'rgba(255,255,255,0.3)'}}>{days.map(d=>DAYS[DAY_KEYS.indexOf(d)]).join(' ')||'ยังไม่ได้วางแผน'}</p></div>);})}
              </div>
            </div>
          </div>
        )}

        {/* ══════════ ROADMAP (ใหม่) ══════════ */}
        {activeTab==='roadmap' && <RoadmapTab isAdmin={isAdmin} />}

        {/* ══════════ LOGS ══════════ */}
        {activeTab==='logs' && (
          <div className="space-y-3">
            <h2 className="text-xs font-bold" style={{color:'rgba(255,255,255,0.4)'}}>ACTIVITY LOG</h2>
            <div className="space-y-2">
              {logs.map((log,i)=>(<div key={i} className="glass rounded-xl px-4 py-3 flex justify-between items-center" style={{border:'1px solid rgba(255,255,255,0.06)'}}><div><span className="text-xs font-bold" style={{color:'#a78bfa'}}>{log.user}</span><span className="text-xs ml-2" style={{color:'rgba(255,255,255,0.6)'}}>{log.action}</span></div><span className="text-xs shrink-0 ml-4" style={{color:'rgba(255,255,255,0.3)'}}>{new Date(log.time).toLocaleTimeString('th-TH')}</span></div>))}
              {!logs.length&&<div className="text-center py-16 text-sm" style={{color:'rgba(255,255,255,0.3)'}}>ยังไม่มีกิจกรรม</div>}
            </div>
          </div>
        )}
      </div>

      {selectedSubject && (
        <SubjectModal subject={selectedSubject} onClose={()=>setSelectedSubjectId(null)}
          onUpdateTopic={handleUpdateTopic} onAddCustomTopic={handleAddCustomTopic}
          onDeleteCustomTopic={handleDeleteCustomTopic} onAddScore={handleAddScore}
          onUpdateTarget={handleUpdateTarget}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
