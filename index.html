            eng: ["Vocabulary (3000 คำ)", "Reading: Advertisements/News", "Reading: Articles/Research", "Conversation: Daily life", "Conversation: Situational", "Grammar & Structure", "Writing: Paragraph Organization"],
            thai: ["หลักการใช้ภาษาไทย", "การอ่านจับใจความ", "การเขียนเพื่อการสื่อสาร", "วรรณคดีวิจารณ์"],
            soc: ["ศาสนา ศีลธรรม จริยธรรม", "หน้าที่พลเมือง", "เศรษฐศาสตร์", "ประวัติศาสตร์", "ภูมิศาสตร์"]
        };

        const Icons = {
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v6a5 5 0 1 1-10 0V4"/><line x1="7" y1="9" x2="17" y2="9"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,

            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        // --- COMPONENTS ---
        const ScoreChart = ({ history, targetScore }) => {
            if (!history || history.length < 2) return (
                <div className="flex flex-col items-center justify-center h-32 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-gray-400 text-xs">
                    <Icons.Trophy />
                    <span className="mt-2">บันทึกคะแนนจำลองอย่างน้อย 2 ครั้งเพื่อดูพัฒนาการสถิติ</span>
                </div>
            );

            const height = 120;
            const width = 500;
            const padding = 20;
            const maxScore = 100;
            const xStep = (width - padding * 2) / (history.length - 1);
            
            const points = history.map((entry, index) => {
                const x = padding + index * xStep;
                const y = height - padding - (entry.score / maxScore) * (height - padding * 2);
                return `${x},${y}`;
            }).join(' ');

            const targetY = height - padding - (targetScore / maxScore) * (height - padding * 2);

            return (
                <div className="w-full overflow-hidden mb-6">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full bg-white rounded-lg border border-gray-100 shadow-sm">
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="#e5e7eb" strokeWidth="1" />
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="4" />
                        {targetScore > 0 && <line x1={padding} y1={targetY} x2={width-padding} y2={targetY} stroke="#10b981" strokeWidth="1" strokeDasharray="4" opacity="0.5" />}
                        <polyline points={points} fill="none" stroke="#4f46e5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                        {history.map((entry, index) => {
                            const x = padding + index * xStep;
                            const y = height - padding - (entry.score / maxScore) * (height - padding * 2);
                            return (
                                <g key={index}>
                                    <circle cx={x} cy={y} r="4" fill="#fff" stroke="#4f46e5" strokeWidth="2" />
                                    <text x={x} y={y - 10} textAnchor="middle" fontSize="10" fill="#6b7280">{entry.score}</text>
                                    <text x={x} y={height - 5} textAnchor="middle" fontSize="8" fill="#9ca3af">{new Date(entry.date).toLocaleDateString('th-TH', {day:'numeric', month:'short'})}</text>
                                </g>
                            );
                        })}
                    </svg>
                    <div className="flex justify-between text-[10px] text-gray-400 mt-1 px-2">
                        <span>ครั้งแรก</span>
                        <div className="flex items-center gap-2">
                            <span className="flex items-center gap-1"><div className="w-2 h-0.5 bg-green-500"></div> เป้าหมาย ({targetScore})</span>
                            <span className="flex items-center gap-1"><div className="w-2 h-0.5 bg-indigo-500"></div> คะแนนจริง</span>
                        </div>
                        <span>ล่าสุด</span>
                    </div>
                </div>
            );
        };

        const SubjectModal = ({ subject, onClose, onUpdateTopic, onAddCustomTopic, onDeleteCustomTopic, onAddScore, onDeleteScore, onUpdateTarget }) => {
            if (!subject) return null;
            const [newScore, setNewScore] = React.useState('');
            const [newDate, setNewDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [customTopicName, setCustomTopicName] = React.useState('');

            const handleAddScore = () => {
                if (newScore === '') return;
                onAddScore(subject.id, parseInt(newScore), newDate);
                setNewScore('');
            };

            const handleAddCustomTopic = (e) => {
                e.preventDefault();
                if (!customTopicName.trim()) return;
                onAddCustomTopic(subject.id, customTopicName.trim());
                setCustomTopicName('');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] shadow-2xl z-10 flex flex-col slide-up overflow-hidden">
                        
                        <div className={`p-6 ${subject.color} bg-opacity-10 border-b border-gray-100 flex justify-between items-start`}>
                            <div className="flex gap-4">
                                <div className={`p-3 rounded-xl ${subject.color} text-white shadow-sm`}>
                                    {subject.icon === 'Target' ? <Icons.Target /> : subject.icon === 'Brain' ? <Icons.Brain /> : <Icons.Book />}
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-800">{subject.name}</h2>
                                    <p className="text-sm text-gray-500 font-medium">น้ำหนักสัดส่วน: {subject.weight}% • ความคืบหน้าภาพรวม: {subject.progress}%</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-400 hover:text-gray-600">
                                <Icons.Close />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            {/* ส่วนผลงานสถิติคะแนน */}
                            <div className="mb-8 bg-gray-50 rounded-xl p-5 border border-gray-100">
                                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                    <Icons.Trophy /> บันทึกสถิติคะแนนสอบ (Mock Exam)
                                </h3>

                                <ScoreChart history={subject.scoreHistory} targetScore={subject.targetScore} />

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div className="bg-white p-4 rounded-lg border border-gray-200">
                                        <label className="text-xs text-gray-500 mb-2 block font-bold">🎯 ตั้งคะแนนเป้าหมาย (เต็ม 100)</label>
                                        <div className="flex items-center gap-2">
                                            <input 
                                                type="number" 
                                                value={subject.targetScore || ''} 
                                                onChange={(e) => onUpdateTarget(subject.id, e.target.value)}
                                                className="w-full font-bold text-indigo-600 bg-gray-50 border border-gray-200 rounded p-2 focus:ring-1 focus:ring-indigo-500"
                                                placeholder="เช่น 65"
                                            />
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg border border-gray-200">
                                        <label className="text-xs text-gray-500 mb-2 block font-bold">📝 เพิ่มผลสอบจำลองล่าสุด</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="number" 
                                                value={newScore}
                                                onChange={(e) => setNewScore(e.target.value)}
                                                className="w-full text-sm border border-gray-200 rounded p-2 focus:ring-1 focus:ring-green-500"
                                                placeholder="คะแนน"
                                            />
                                            <button 
                                                onClick={handleAddScore}
                                                className="bg-gray-800 text-white text-xs px-4 rounded hover:bg-gray-900 flex items-center gap-1 shrink-0"
                                            >
                                                <Icons.Plus /> เพิ่ม
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* ระบบเพิ่มหัวข้อ Dynamic Checklist */}
                            <div className="mb-6">
                                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3 flex justify-between items-center">
                                    <span>หัวข้อบทเรียนและแผนปฎิบัติงาน ({subject.topics.length})</span>
                                </h3>

                                <form onSubmit={handleAddCustomTopic} className="flex gap-2 mb-4">
                                    <input 
                                        type="text" 
                                        value={customTopicName}
                                        onChange={(e) => setCustomTopicName(e.target.value)}
                                        placeholder="➕ พิมพ์เพิ่มหัวข้อบทเรียนย่อยหรือ Checklist แผนงานของน้องได้ที่นี่..."
                                        className="flex-1 text-sm border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                    />
                                    <button 
                                        type="submit"
                                        className="bg-indigo-600 text-white text-sm px-4 rounded-lg hover:bg-indigo-700 flex items-center gap-1 font-medium"
                                    >
                                        <Icons.Plus /> เพิ่มเนื้อหา
                                    </button>
                                </form>

                                <div className="space-y-2">
                                    {subject.topics.map((topic, index) => (
                                        <div key={index} className="flex items-center justify-between p-3 rounded-lg border border-gray-100 hover:bg-gray-50 transition-all group">
                                            <label className="flex items-center cursor-pointer flex-1 mr-4">
                                                <div className="relative flex items-center">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={topic.completed} 
                                                        onChange={() => onUpdateTopic(subject.id, index)}
                                                        className="peer h-5 w-5 cursor-pointer appearance-none rounded-md border-2 border-gray-300 transition-all checked:border-green-500 checked:bg-green-500"
                                                    />
                                                    <div className="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100">
                                                        <Icons.Check />
                                                    </div>
                                                </div>
                                                <span className={`ml-3 text-sm transition-colors ${topic.completed ? 'text-gray-400 line-through' : 'text-gray-700 font-medium'}`}>
                                                    {topic.name}
                                                </span>
                                            </label>
                                            
                                            {/* ปุ่มลบกรณีหัวข้อตกหล่นหรืออยากเคลียร์ */}
                                            <button 
                                                onClick={() => onDeleteCustomTopic(subject.id, index)}
                                                className="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1"
                                                title="ลบหัวข้อนี้"
                                            >
                                                <Icons.Trash />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="p-4 border-t border-gray-100 bg-gray-50 text-right">
                            <button onClick={onClose} className="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-medium text-sm">
                                บันทึกและปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dek71Dashboard = () => {
            const [subjects, setSubjects] = React.useState([]);
            const [totalReadiness, setTotalReadiness] = React.useState(0);
            const [averageScore, setAverageScore] = React.useState(0);
            const [selectedSubject, setSelectedSubject] = React.useState(null);
            const [status, setStatus] = React.useState('connecting'); 
            
            // เพิ่มการแยกสถานะวันสอบของ TPAT1 และ A-Level ออกจากกันชัดเจน
            const [tpatDateStr, setTpatDateStr] = React.useState('2027-12-18'); 
            const [alevelDateStr, setAlevelDateStr] = React.useState('2028-03-18');
            const [isEditingTpat, setIsEditingTpat] = React.useState(false);
            const [isEditingAlevel, setIsEditingAlevel] = React.useState(false);

            const [tpatCountdown, setTpatCountdown] = React.useState({ days: 0 });
            const [alevelCountdown, setAlevelCountdown] = React.useState({ days: 0 });

            const createInitialData = () => {
                return [
                    { id: 'tpat1', name: 'TPAT1 (ความถนัดแพทย์)', weight: 30, color: 'bg-orange-500', icon: 'Brain', targetScore: 65 },
                    { id: 'math1', name: 'คณิตศาสตร์ 1', weight: 14, color: 'bg-blue-600', icon: 'Target', targetScore: 60 },
                    { id: 'phy', name: 'ฟิสิกส์', weight: 9.33, color: 'bg-indigo-500', icon: 'Book', targetScore: 55 },
                    { id: 'chem', name: 'เคมี', weight: 9.33, color: 'bg-teal-500', icon: 'Book', targetScore: 60 },
                    { id: 'bio', name: 'ชีววิทยา', weight: 9.33, color: 'bg-green-500', icon: 'Book', targetScore: 65 },
                    { id: 'eng', name: 'ภาษาอังกฤษ', weight: 14, color: 'bg-purple-600', icon: 'Book', targetScore: 70 },
                    { id: 'thai', name: 'ภาษาไทย', weight: 7, color: 'bg-pink-500', icon: 'Book', targetScore: 70 },
                    { id: 'soc', name: 'สังคมศึกษา', weight: 7, color: 'bg-yellow-500', icon: 'Book', targetScore: 60 },
                ].map(sub => ({
                    ...sub,
                    progress: 0,
                    lastUpdated: null,
                    scoreHistory: [],
                    topics: MASTER_CURRICULUM[sub.id] ? MASTER_CURRICULUM[sub.id].map(topic => ({ name: topic, completed: false })) : []
                }));
            };

            // ดึงข้อมูลและ Sync ระบบคลาวด์
            React.useEffect(() => {
                if (!db) {
                    setStatus('offline');
                    const savedData = localStorage.getItem('dek71_local_v2');
                    if (savedData) {
                        const parsed = JSON.parse(savedData);
                        setSubjects(parsed.subjects || createInitialData());
                        if(parsed.tpatDate) setTpatDateStr(parsed.tpatDate);
                        if(parsed.alevelDate) setAlevelDateStr(parsed.alevelDate);
                    } else {
                        setSubjects(createInitialData());
                    }
                    return;
                }
                
                const docRef = db.collection('dek71_data').doc('user_control_v2');
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        setSubjects(data.subjects || createInitialData());
                        if(data.tpatDate) setTpatDateStr(data.tpatDate);
                        if(data.alevelDate) setAlevelDateStr(data.alevelDate);
                    } else {
                        const initialData = createInitialData();
                        docRef.set({ subjects: initialData, tpatDate: '2027-12-18', alevelDate: '2028-03-18' });
                        setSubjects(initialData);
                    }
                    setStatus('online');
                }, (err) => {
                    setStatus('offline (error)');
                    const savedData = localStorage.getItem('dek71_local_v2');
                    if (savedData) setSubjects(JSON.parse(savedData).subjects);
                });
                
                return () => unsubscribe();
            }, []);

            // ตัวนับถอยหลังแยกงานสอบความถี่ Real-time
            React.useEffect(() => {
                const timer = setInterval(() => {
                    const calculateDays = (dateStr) => {
                        const diff = new Date(dateStr + 'T00:00:00') - new Date();
                        return diff > 0 ? Math.ceil(diff / (1000 * 60 * 60 * 24)) : 0;
                    };
                    setTpatCountdown({ days: calculateDays(tpatDateStr) });
                    setAlevelCountdown({ days: calculateDays(alevelDateStr) });
                }, 1000);
                return () => clearInterval(timer);
            }, [tpatDateStr, alevelDateStr]);

            const saveState = (updatedSubs, tpatD = tpatDateStr, alevelD = alevelDateStr) => {
                localStorage.setItem('dek71_local_v2', JSON.stringify({ subjects: updatedSubs, tpatDate: tpatD, alevelDate: alevelD }));
                if (db) {
                    db.collection('dek71_data').doc('user_control_v2').set({ subjects: updatedSubs, tpatDate: tpatD, alevelDate: alevelD }).catch(e => console.error(e));
                }
            };

            // อัปเดตข้อมูลวิชาการคำนวณถ่วงน้ำหนักความพร้อม
            React.useEffect(() => {
                if (subjects.length > 0) {
                    const weightedScore = subjects.reduce((acc, sub) => acc + (sub.progress * sub.weight / 100), 0);
                    setTotalReadiness(weightedScore || 0);

                    const subjectsWithScore = subjects.filter(s => s.scoreHistory && s.scoreHistory.length > 0);
                    if (subjectsWithScore.length > 0) {
                        const sumLatest = subjectsWithScore.reduce((acc, s) => acc + s.scoreHistory[s.scoreHistory.length-1].score, 0);
                        setAverageScore(sumLatest / subjectsWithScore.length);
                    } else {
                        setAverageScore(0);
                    }
                }
            }, [subjects]);

            const updateSubjectState = (subjectId, updaterFn) => {
                const newSubjects = subjects.map(sub => {
                    if (sub.id !== subjectId) return sub;
                    const updated = updaterFn(sub);
                    updated.lastUpdated = new Date().toISOString();
                    if (selectedSubject && selectedSubject.id === subjectId) setSelectedSubject(updated);
                    return updated;
                });
                setSubjects(newSubjects);
                saveState(newSubjects);
            };

            // จัดการข้อมูล Checklist
            const handleUpdateTopic = (subjectId, topicIndex) => {
                updateSubjectState(subjectId, (sub) => {
                    const newTopics = sub.topics.map((t, i) => i === topicIndex ? { ...t, completed: !t.completed } : t);
                    const progress = Math.round((newTopics.filter(t => t.completed).length / newTopics.length) * 100);
                    return { ...sub, topics: newTopics, progress };
                });
            };

            // ฟังก์ชันเพิ่มหัวข้อกำหนดเองลงในวิชา
            const handleAddCustomTopic = (subjectId, topicName) => {
                updateSubjectState(subjectId, (sub) => {
                    const newTopics = [...sub.topics, { name: topicName, completed: false }];
                    const progress = Math.round((newTopics.filter(t => t.completed).length / newTopics.length) * 100);
                    return { ...sub, topics: newTopics, progress };
                });
            };

            // ฟังก์ชันลบหัวข้อกรณีต้องการคัดแยกงานออก
            const handleDeleteCustomTopic = (subjectId, topicIndex) => {
                updateSubjectState(subjectId, (sub) => {
                    const newTopics = sub.topics.filter((_, i) => i !== topicIndex);
                    const progress = newTopics.length > 0 ? Math.round((newTopics.filter(t => t.completed).length / newTopics.length) * 100) : 0;
                    return { ...sub, topics: newTopics, progress };
                });
            };

            const handleAddScore = (subjectId, score, date) => {
                updateSubjectState(subjectId, (sub) => ({ ...sub, scoreHistory: [...sub.scoreHistory, { score, date }] }));
            };

            const handleDeleteScore = (subjectId, index) => {
                updateSubjectState(subjectId, (sub) => {
                    const hist = [...sub.scoreHistory]; hist.splice(index, 1);
                    return { ...sub, scoreHistory: hist };
                });
            };

            const handleUpdateTarget = (subjectId, val) => {
                updateSubjectState(subjectId, (sub) => ({ ...sub, targetScore: val === '' ? 0 : parseInt(val) }));
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 min-h-screen">
                    <header className="mb-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-6">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-2">
                                    <span className="bg-indigo-600 text-white p-2 rounded-lg"><Icons.Target /></span>
                                    Dek71 Tracker (Mission Control V2)
                                </h1>
                                <p className="text-xs font-bold text-gray-400 mt-2">📊 ติดตามความพร้อมและสถิติคะแนนจำลองอย่างละเอียดเพื่อลูกรัก</p>
                            </div>

                            {/* แผงควบคุมตั้งค่าวันสอบแบบแยกส่วนงานอย่างอิสระ */}
                            <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                                <div className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3">
                                    <div className="p-2 bg-orange-100 rounded-lg text-orange-600"><Icons.Clock /></div>
                                    <div>
                                        <div className="text-[10px] text-gray-400 font-bold uppercase">สอบวิชาเฉพาะ TPAT1</div>
                                        <div className="text-md font-bold text-orange-600">{tpatCountdown.days} วันที่เหลือ</div>
                                        {isEditingTpat ? (
                                            <input type="date" value={tpatDateStr} onChange={(e) => { setTpatDateStr(e.target.value); saveState(subjects, e.target.value, alevelDateStr); }} onBlur={()=>setIsEditingTpat(false)} className="text-[10px] border p-0.5 rounded" autoFocus />
                                        ) : (
                                            <span onClick={()=>setIsEditingTpat(true)} className="text-[10px] text-gray-400 flex items-center gap-1 cursor-pointer hover:text-indigo-500">วันสอบ: {tpatDateStr} <Icons.Edit /></span>
                                        )}
                                    </div>
                                </div>

                                <div className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3">
                                    <div className="p-2 bg-blue-100 rounded-lg text-blue-600"><Icons.Calendar /></div>
                                    <div>
                                        <div className="text-[10px] text-gray-400 font-bold uppercase">สอบวิชาสามัญ A-Level</div>
                                        <div className="text-md font-bold text-blue-600">{alevelCountdown.days} วันที่เหลือ</div>
                                        {isEditingAlevel ? (
                                            <input type="date" value={alevelDateStr} onChange={(e) => { setAlevelDateStr(e.target.value); saveState(subjects, tpatDateStr, e.target.value); }} onBlur={()=>setIsEditingAlevel(false)} className="text-[10px] border p-0.5 rounded" autoFocus />
                                        ) : (
                                            <span onClick={()=>setIsEditingAlevel(true)} className="text-[10px] text-gray-400 flex items-center gap-1 cursor-pointer hover:text-indigo-500">วันสอบ: {alevelDateStr} <Icons.Edit /></span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* การ์ดสถิติรวม */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-5 text-white shadow-lg">
                                <div className="text-sm font-medium opacity-90 mb-1">ความพร้อมรวมสะสม (Weighted Readiness)</div>
                                <div className="text-4xl font-bold">{totalReadiness.toFixed(2)}%</div>
                                <div className="w-full bg-black/20 rounded-full h-1.5 mt-3 overflow-hidden">
                                    <div className="bg-white h-full" style={{ width: `${totalReadiness}%` }}></div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm flex items-center justify-between">
                                <div>
                                    <div className="text-sm text-gray-500 font-medium flex items-center gap-2"><span className="text-orange-500"><Icons.Trophy /></span> คะแนนรวมเฉลี่ยจากการจำลองข้อสอบ</div>
                                    <div className="text-4xl font-bold text-gray-800 mt-1">{averageScore.toFixed(1)} <span className="text-sm font-normal text-gray-400">/100</span></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* ตารางแสดงผลรายวิชาทั้งหมด */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {subjects.map((sub) => {
                            const latest = sub.scoreHistory && sub.scoreHistory.length > 0 ? sub.scoreHistory[sub.scoreHistory.length-1].score : 0;
                            return (
                                <div 
                                    key={sub.id} 
                                    onClick={() => setSelectedSubject(sub)}
                                    className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 cursor-pointer hover:shadow-md transition-all relative overflow-hidden"
                                >
                                    <div className={`absolute bottom-0 left-0 h-1 ${sub.color}`} style={{ width: `${sub.progress}%` }}></div>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className={`p-2 rounded-lg ${sub.color} bg-opacity-10 text-gray-700`}>
                                            {sub.icon === 'Target' ? <Icons.Target /> : sub.icon === 'Brain' ? <Icons.Brain /> : <Icons.Book />}
                                        </div>
                                        <span className="text-xl font-bold text-gray-700">{sub.progress}%</span>
                                    </div>
                                    <h3 className="font-bold text-gray-800">{sub.name}</h3>
                                    <div className="flex justify-between items-center text-xs text-gray-500 mt-3 p-1.5 bg-gray-50 rounded">
                                        <span>เป้าหมาย: {sub.targetScore || '-'}</span>
                                        <span className="font-bold text-indigo-600">ทำได้จริง: {latest || '-'}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {selectedSubject && (
                        <SubjectModal 
                            subject={selectedSubject} 
                            onClose={() => setSelectedSubject(null)} 
                            onUpdateTopic={handleUpdateTopic}
                            onAddCustomTopic={handleAddCustomTopic}
                            onDeleteCustomTopic={handleDeleteCustomTopic}
                            onAddScore={handleAddScore}
                            onDeleteScore={handleDeleteScore}
                            onUpdateTarget={handleUpdateTarget}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dek71Dashboard />);
    </script>
</body>
</html>
