        const Icons = {

            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v6a5 5 0 1 1-10 0V4"/><line x1="7" y1="9" x2="17" y2="9"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        };

        const ScoreChart = ({ history, targetScore }) => {
            if (!history || history.length < 2) return (
                <div className="flex flex-col items-center justify-center h-32 bg-gray-50 rounded-lg border border-dashed border-gray-200 text-gray-400 text-xs">
                    <Icons.Trophy />
                    <span className="mt-2 text-center">บันทึกคะแนนสอบอย่างน้อย 2 ครั้งเพื่อดูแนวโน้ม</span>
                </div>
            );
            const height = 120; const width = 500; const padding = 20; const maxScore = 100;
            const xStep = (width - padding * 2) / (history.length - 1);
            const points = history.map((entry, idx) => `${padding + idx * xStep},${height - padding - (entry.score / maxScore) * (height - padding * 2)}`).join(' ');
            const targetY = height - padding - (targetScore / maxScore) * (height - padding * 2);
            return (
                <div className="w-full overflow-hidden mb-6">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full bg-white rounded-lg border border-gray-100 shadow-sm">
                        <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="#e5e7eb" />
                        <line x1={padding} y1={padding} x2={width-padding} y2={padding} stroke="#e5e7eb" strokeDasharray="4" />
                        {targetScore > 0 && <line x1={padding} y1={targetY} x2={width-padding} y2={targetY} stroke="#10b981" strokeDasharray="4" opacity="0.5" />}
                        <polyline points={points} fill="none" stroke="#4f46e5" strokeWidth="2" />
                        {history.map((entry, idx) => (
                            <g key={idx}>
                                <circle cx={padding + idx * xStep} cy={height - padding - (entry.score / maxScore) * (height - padding * 2)} r="4" fill="#fff" stroke="#4f46e5" strokeWidth="2" />
                                <text x={padding + idx * xStep} y={height - padding - (entry.score / maxScore) * (height - padding * 2) - 10} textAnchor="middle" fontSize="10" fill="#6b7280">{entry.score}</text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        const SubjectModal = ({ subject, onClose, onUpdateTopic, onAddCustomTopic, onDeleteCustomTopic, onAddScore, onUpdateTarget }) => {
            if (!subject) return null;
            const [newScore, setNewScore] = React.useState('');
            const [customTopic, setCustomTopic] = React.useState('');
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] shadow-2xl z-10 flex flex-col slide-up overflow-hidden">
                        <div className={`p-6 ${subject.color} bg-opacity-10 border-b border-gray-100 flex justify-between items-center`}>
                            <h2 className="text-2xl font-bold text-gray-800">{subject.name} <span className="text-sm font-normal text-gray-500 ml-2">(น้ำหนัก {subject.weight}%)</span></h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full text-gray-400"><Icons.Close /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                            <div className="mb-6 bg-gray-50 rounded-xl p-5 border border-gray-100">
                                <ScoreChart history={subject.scoreHistory} targetScore={subject.targetScore} />
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">🎯 เป้าหมาย (เต็ม 100)</label>
                                        <input type="number" value={subject.targetScore || ''} onChange={(e) => onUpdateTarget(subject.id, e.target.value)} className="w-full border rounded p-2 text-indigo-600 font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 mb-1 block font-bold">📝 เพิ่มผลสอบจำลองล่าสุด</label>
                                        <div className="flex gap-2">
                                            <input type="number" value={newScore} onChange={(e) => setNewScore(e.target.value)} className="w-full border rounded p-2" placeholder="คะแนน 0-100" />
                                            <button onClick={() => { if(newScore) { onAddScore(subject.id, parseInt(newScore)); setNewScore(''); } }} className="bg-gray-800 text-white px-4 rounded text-xs">บันทึก</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h3 className="font-bold text-sm text-gray-400 mb-3 uppercase">เช็คลิสต์เนื้อหาบทเรียน</h3>
                                <div className="flex gap-2 mb-4">
                                    <input type="text" value={customTopic} onChange={(e) => setCustomTopic(e.target.value)} placeholder="เพิ่มหัวข้อเรียนเฉพาะเพิ่มเติม..." className="flex-1 border rounded p-2 text-sm" />
                                    <button onClick={() => { if(customTopic.trim()) { onAddCustomTopic(subject.id, customTopic.trim()); setCustomTopic(''); } }} className="bg-indigo-600 text-white px-4 rounded text-sm font-medium">เพิ่มเนื้อหา</button>
                                </div>
                                <div className="space-y-2">
                                    {(subject.topics || []).map((topic, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-3 border rounded-lg hover:bg-gray-50">
                                            <label className="flex items-center cursor-pointer flex-1">
                                                <input type="checkbox" checked={topic.completed} onChange={() => onUpdateTopic(subject.id, idx)} className="h-4 w-4 rounded text-green-500 mr-3" />
                                                <span className={`text-sm ${topic.completed ? 'text-gray-400 line-through' : 'text-gray-700 font-medium'}`}>{topic.name}</span>
                                            </label>
                                            <button onClick={() => onDeleteCustomTopic(subject.id, idx)} className="text-gray-300 hover:text-red-500"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [authMode, setAuthMode] = React.useState('login'); 
            const [currentSession, setCurrentSession] = React.useState(null); 
            const [isAuthReady, setIsAuthReady] = React.useState(false); 
            
            // Login Inputs
            const [usernameInput, setUsernameInput] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [errorMessage, setErrorMessage] = React.useState('');
            
            const createInitialData = () => [
                { id: 'tpat1', name: 'TPAT1 (ความถนัดแพทย์)', weight: 30, color: 'bg-orange-500', icon: 'Brain', targetScore: 60 },
                { id: 'math1', name: 'คณิตศาสตร์ 1', weight: 14, color: 'bg-blue-600', icon: 'Target', targetScore: 50 },
                { id: 'phy', name: 'ฟิสิกส์', weight: 9.33, color: 'bg-indigo-500', icon: 'Book', targetScore: 50 },
                { id: 'chem', name: 'เคมี', weight: 9.33, color: 'bg-teal-500', icon: 'Book', targetScore: 50 },
                { id: 'bio', name: 'ชีววิทยา', weight: 9.33, color: 'bg-green-500', icon: 'Book', targetScore: 50 },
                { id: 'eng', name: 'ภาษาอังกฤษ', weight: 14, color: 'bg-purple-600', icon: 'Book', targetScore: 60 },
                { id: 'thai', name: 'ภาษาไทย', weight: 7, color: 'bg-pink-500', icon: 'Book', targetScore: 60 },
                { id: 'soc', name: 'สังคมศึกษา', weight: 7, color: 'bg-yellow-500', icon: 'Book', targetScore: 50 }
            ].map(s => ({ 
                ...s, 
                progress: 0, 
                scoreHistory: [], 
                topics: MASTER_CURRICULUM[s.id] ? MASTER_CURRICULUM[s.id].map(t => ({ name: t, completed: false })) : []
            }));

            // States
            const [subjects, setSubjects] = React.useState(createInitialData());
            const [logs, setLogs] = React.useState([]);
            const [familyAccounts, setFamilyAccounts] = React.useState([]); 
            
            // UI States
            const [showAdminPanel, setShowAdminPanel] = React.useState(false);
            const [selectedSubject, setSelectedSubject] = React.useState(null);
            const [showResetModal, setShowResetModal] = React.useState(false);

            // Admin Form
            const [newFamUsername, setNewFamUsername] = React.useState('');
            const [newFamPassword, setNewFamPassword] = React.useState('');

            // คำนวณคะแนนรวมตาม Weight แบบ กสพท. และคำนวณคะแนนดิบรวม 800
            const calculateScores = () => {
                let totalWeighted = 0;
                let totalWeightedTarget = 0;
                let totalRaw = 0;
                let totalRawTarget = 0;
                let maxRawPossible = subjects.length * 100;
                
                subjects.forEach(sub => {
                    const weightPct = sub.weight / 100;
                    
                    const latestScore = sub.scoreHistory && sub.scoreHistory.length > 0 
                        ? sub.scoreHistory[sub.scoreHistory.length - 1].score 
                        : 0;
                    const target = sub.targetScore || 0;
                        
                    totalWeighted += latestScore * weightPct;
                    totalWeightedTarget += target * weightPct;
                    totalRaw += latestScore;
                    totalRawTarget += target;
                });
                
                return { 
                    weightedCurrent: totalWeighted.toFixed(2), 
                    weightedTarget: totalWeightedTarget.toFixed(2),
                    rawCurrent: totalRaw,
                    rawTarget: totalRawTarget,
                    maxRaw: maxRawPossible
                };
            };

            const stats = calculateScores();

            React.useEffect(() => {
                const setupAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                        setIsAuthReady(true);
                    } catch (e) {
                        console.warn("Anonymous auth failed", e);
                    }
                };
                setupAuth();

                const savedSession = localStorage.getItem('med71_session');
                if (savedSession) {
                    setCurrentSession(JSON.parse(savedSession));
                    setAuthMode('dashboard');
                }
            }, []);

            React.useEffect(() => {
                if (authMode !== 'dashboard' || !isAuthReady) return;

                const dashboardRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared');
                
                const unsubData = dashboardRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const loaded = doc.data().subjects || [];
                        if (loaded.length === 0) {
                            setSubjects(createInitialData());
                        } else {
                            const healed = loaded.map(loadedSub => {
                                const defaultSub = createInitialData().find(s => s.id === loadedSub.id);
                                if (!loadedSub.topics || loadedSub.topics.length === 0) {
                                    loadedSub.topics = defaultSub ? defaultSub.topics : [];
                                }
                                return loadedSub;
                            });
                            setSubjects(healed);
                        }
                    } else {
                        const init = createInitialData();
                        dashboardRef.set({ subjects: init });
                        setSubjects(init);
                    }
                }, (err) => console.error("Data load err:", err));

                const unsubLogs = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs')
                    .onSnapshot((snap) => {
                        const l = [];
                        snap.forEach(d => l.push({ id: d.id, ...d.data() }));
                        setLogs(l.sort((a,b) => new Date(b.time) - new Date(a.time)).slice(0, 15));
                    }, (err) => console.error("Logs load err:", err));

                const unsubAccounts = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            setFamilyAccounts(doc.data().accounts || []);
                        }
                    }, (err) => console.error("Accounts load err:", err));

                return () => { unsubData(); unsubLogs(); unsubAccounts(); };
            }, [authMode, isAuthReady]);

            const addLogToCloud = async (user, action) => {
                if (!isAuthReady) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('shared_logs').add({
                        user, action, time: new Date().toISOString()
                    });
                } catch (e) { console.error("Log error", e); }
            };

            const saveSubjectsToCloud = async (newSubs) => {
                if (!isAuthReady) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('dashboard_shared').set({ subjects: newSubs });
                } catch (e) { console.error("Save error", e); }
            };

            const handleUpdateTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = s.topics.map((t, idx) => idx === topicIdx ? { ...t, completed: !t.completed } : t);
                    const pct = Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100);
                    return { ...s, topics: nextTopics, progress: pct };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `อัปเดตสถานะเนื้อหาในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleAddCustomTopic = (subId, name) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = [...s.topics, { name, completed: false }];
                    return { ...s, topics: nextTopics, progress: Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `เพิ่มบทเรียนพิเศษในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleDeleteCustomTopic = (subId, topicIdx) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    const nextTopics = s.topics.filter((_, idx) => idx !== topicIdx);
                    return { ...s, topics: nextTopics, progress: nextTopics.length ? Math.round((nextTopics.filter(t=>t.completed).length / nextTopics.length) * 100) : 0 };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `ลบเนื้อหาในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleAddScore = (subId, score) => {
                const updated = subjects.map(s => {
                    if (s.id !== subId) return s;
                    return { ...s, scoreHistory: [...s.scoreHistory, { score, date: new Date().toISOString() }] };
                });
                setSubjects(updated); saveSubjectsToCloud(updated);
                addLogToCloud(currentSession.name, `บันทึกคะแนนจำลอง (${score}) ในวิชา ${subjects.find(s=>s.id===subId).name}`);
            };

            const handleUpdateTarget = (subId, score) => {
                const updated = subjects.map(s => (s.id === subId ? { ...s, targetScore: score === '' ? 0 : parseInt(score) } : s));
                setSubjects(updated); saveSubjectsToCloud(updated);
            };

            const forceResetCurriculum = () => {
                const initData = createInitialData();
                const mergedWithScores = initData.map(dSub => {
                    const currentSub = subjects.find(s => s.id === dSub.id);
                    return {
                        ...dSub,
                        scoreHistory: currentSub ? currentSub.scoreHistory : [],
                        targetScore: currentSub ? currentSub.targetScore : dSub.targetScore
                    };
                });
                setSubjects(mergedWithScores);
                saveSubjectsToCloud(mergedWithScores);
                addLogToCloud(currentSession.name, '🔄 ดำเนินการฟื้นฟู Checklist บทเรียนเริ่มต้นสำเร็จ');
                setShowResetModal(false);
            };

            const handleUserLogin = (e) => {
                e.preventDefault();
                setErrorMessage('');
                const user = usernameInput.trim();
                const pass = passwordInput.trim();
                const found = familyAccounts.find(acc => acc.username === user && acc.password === pass);
                
                if (found) {
                    const session = { name: found.username, role: 'member' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    addLogToCloud(found.username, "เข้าสู่ระบบแพลตฟอร์มการประเมิน");
                } else {
                    setErrorMessage('❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setErrorMessage('');
                if (email.trim().toLowerCase() === ADMIN_EMAIL.toLowerCase() && password === ADMIN_PASS) {
                    const session = { name: 'ผู้ดูแลระบบ (Admin)', role: 'admin' };
                    setCurrentSession(session);
                    localStorage.setItem('med71_session', JSON.stringify(session));
                    setAuthMode('dashboard');
                    addLogToCloud('ผู้ดูแลระบบ', "เข้าสู่ระบบศูนย์ควบคุม (Admin Control)");
                } else {
                    setErrorMessage('❌ อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้อง');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('med71_session');
                setCurrentSession(null);
                setAuthMode('login');
                setUsernameInput(''); setPasswordInput('');
                setEmail(''); setPassword('');
                setShowAdminPanel(false);
            };

            const handleCreateAccount = async (e) => {
                e.preventDefault();
                const u = newFamUsername.trim(); const p = newFamPassword.trim();
                if (!u || !p) return;
                if (familyAccounts.some(acc => acc.username === u)) {
                    alert("ชื่อผู้ใช้งานนี้ถูกใช้ไปแล้ว"); return;
                }
                const updated = [...familyAccounts, { username: u, password: p }];
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({ accounts: updated });
                    addLogToCloud('ผู้ดูแลระบบ', `สร้างบัญชีผู้ใช้งานใหม่: ${u}`);

            };

            const handleDeleteAccount = async (u) => {

                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dek71_data').doc('family_accounts').set({ accounts: updated });

                            <form onSubmit={handleUserLogin} className="space-y-4 text-left">
                                <div>
                                    <label className="text-xs font-bold text-gray-500">ชื่อผู้ใช้งาน (Username)</label>
                                    <input type="text" required value={usernameInput} onChange={(e)=>setUsernameInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="ป้อนชื่อผู้ใช้งาน..." />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">รหัสผ่าน (Password)</label>
                                    <input type="password" required value={passwordInput} onChange={(e)=>setPasswordInput(e.target.value)} className="w-full border rounded-lg p-2.5 mt-1 focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="ป้อนรหัสผ่าน..." />
                                </div>
                                {errorMessage && <p className="text-xs text-red-500 font-bold bg-red-50 p-2.5 rounded-lg">{errorMessage}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded-lg transition-colors">
                                    เข้าใช้งานระบบเตรียมสอบ
                                </button>

                            <div className="mt-8 pt-4 border-t text-sm">
                                <p onClick={()=> { setAuthMode('admin_login'); setErrorMessage(''); }} className="text-gray-500 hover:text-indigo-600 font-bold cursor-pointer transition-colors">
                                    ⚙️ สำหรับผู้ดูแลระบบ (Admin)
                                </p>
                            </div>
                        </div>
                    </div>

                                        🔄 ฟื้นฟู Checklist มาตรฐาน

                                        <input type="text" required value={newFamUsername} onChange={(e)=>setNewFamUsername(e.target.value)} placeholder="เช่น user01" className="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">รหัสผ่าน (Password)</label>
                                        <input type="text" required value={newFamPassword} onChange={(e)=>setNewFamPassword(e.target.value)} placeholder="กำหนดรหัสผ่าน" className="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-1 focus:ring-blue-500 focus:outline-none" />
                                    </div>
                                    <div className="flex items-end">
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 text-sm rounded-lg transition-colors h-10">
                                            ➕ สร้างผู้ใช้งาน
                                        </button>
                                    </div>
                                </form>

                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-blue-900 uppercase tracking-wider">บัญชีที่ได้รับอนุญาตในปัจจุบัน:</h4>
                                    <div className="max-h-48 overflow-y-auto space-y-1.5 scrollbar-hide">
                                        {familyAccounts.map((acc, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded-lg border border-blue-100 flex justify-between items-center text-sm shadow-sm">
                                                <div>
                                                    <span className="font-bold text-gray-700">User: </span><span className="text-indigo-600 font-bold mr-4">{acc.username}</span>
                                                    <span className="font-bold text-gray-500">Pass: </span><span className="text-gray-700 font-bold">{acc.password}</span>
                                                </div>
                                                <button onClick={()=>handleDeleteAccount(acc.username)} className="text-red-400 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition-colors"><Icons.Trash /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* DASHBOARD CALCULATION SECTION */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {/* 1. กล่องคะแนนถ่วงน้ำหนัก (กสพท) */}
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-5 text-white shadow-lg flex flex-col justify-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-20"><Icons.Trophy /></div>
                                <div className="text-sm opacity-90 mb-1 font-medium">คะแนนรวมถ่วงน้ำหนัก (กสพท)</div>
                                <div className="text-3xl font-bold">{stats.weightedCurrent} <span className="text-lg font-normal opacity-80">/ 100</span></div>
                                <div className="text-xs mt-2 bg-black/20 rounded inline-block px-2 py-1 self-start">เป้าหมาย: {stats.weightedTarget}</div>
                            </div>
                            
                            {/* 2. กล่องคะแนนดิบรวม */}
                            <div className="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-5 text-white shadow-lg flex flex-col justify-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-20"><Icons.Target /></div>
                                <div className="text-sm opacity-90 mb-1 font-medium">คะแนนดิบรวม (ทุกวิชา)</div>
                                <div className="text-3xl font-bold">{stats.rawCurrent} <span className="text-lg font-normal opacity-80">/ {stats.maxRaw}</span></div>
                                <div className="w-full bg-black/20 rounded-full h-1.5 mt-3 overflow-hidden">
                                    <div className="bg-white h-full transition-all duration-500" style={{ width: `${(stats.rawCurrent / stats.maxRaw) * 100}%` }}></div>
                                </div>
                            </div>

                            {/* 3. กล่องความคืบหน้าเนื้อหาและความปลอดภัย */}
                            <div className="bg-white rounded-2xl p-5 border shadow-sm flex flex-col justify-between">
                                <div>
                                    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">ความพร้อมเนื้อหาบทเรียนเฉลี่ยรวม</div>
                                    <div className="text-2xl font-bold text-gray-700">{totalReadiness.toFixed(2)}%</div>
                                </div>
                                <div className="mt-4 pt-3 border-t border-gray-100">
                                    <span className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1 block">สถานะฐานข้อมูล</span>
                                    {isAuthReady ? (
                                        <span className="text-xs font-bold text-green-600 flex items-center gap-1.5">
                                            <div className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div> ซิงค์ข้อมูลข้ามเครื่องเรียลไทม์ปกติ
                                        </span>

                                        <span className="text-xs font-bold text-amber-500 flex items-center gap-1.5">
                                            <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div> กำลังเชื่อมต่อระบบความปลอดภัย...
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>

                        {}
                        {/* 4. แถบแสดงความคืบหน้ารายวิชา (โชว์ที่ Dashboard กลางตามที่ต้องการ) */}
                        <div className="mt-4 bg-white rounded-2xl p-5 border shadow-sm slide-up">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <Icons.Book /> ความคืบหน้าในการเรียนแต่ละวิชา
                            </h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-4">
                                {subjects.map((sub) => (
                                    <div key={`prog-${sub.id}`} className="flex flex-col">
                                        <div className="flex justify-between items-end mb-1">
                                            <span className="text-xs font-bold text-gray-700 truncate pr-2">{sub.name}</span>
                                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md text-white ${sub.color}`}>{sub.progress}%</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden shadow-inner">
                                            <div className={`h-full ${sub.color} transition-all duration-500`} style={{ width: `${sub.progress}%` }}></div>
                                        </div>

                                            <span className="text-lg font-bold text-gray-700 block">{sub.progress}%</span>

                                    </div>
                                </div>
                                <h3 className="text-lg font-bold text-gray-800 mb-2">ยืนยันการฟื้นฟูบทเรียนหลัก?</h3>
                                <p className="text-sm text-gray-500 mb-6">โครงสร้างหัวข้อเรียนจะถูกจัดเรียงใหม่ตามระบบมาตรฐาน (ประวัติคะแนนสอบและเป้าหมายจะไม่สูญหาย)</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowResetModal(false)} className="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors">ยกเลิก</button>
                                    <button onClick={forceResetCurriculum} className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg text-sm transition-colors">ยืนยันกู้คืนวิชา</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
