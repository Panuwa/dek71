// ── Helpers ──────────────────────────────────────────────────────────────────
function getReadPct(sub) {
  if (!sub || !sub.topics || !sub.topics.length) return 0;
  return Math.round((sub.topics.filter(t => t.read).length / sub.topics.length) * 100);
}
function getAvgScore(sub) {
  if (!sub.mockScores || !sub.mockScores.length) return null;
  return Math.round(sub.mockScores.reduce((a,b) => a+b, 0) / sub.mockScores.length);
}
function getLastScore(sub) { return sub.mockScores && sub.mockScores.length ? sub.mockScores[sub.mockScores.length-1] : null; }
function getCountdown(dateStr) {
  const diff = new Date(dateStr) - new Date();
  if (diff < 0) return { text: 'ผ่านแล้ว', past: true };
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  if (days > 0) return { text: `${days} วัน`, past: false };
  return { text: `${hours} ชั่วโมง`, past: false };
}
function createInitialSubjects() {
  return Object.entries(MASTER_CURRICULUM).map(([id, topics]) => ({
    id, topics: topics.map(t => ({ name: t, read: false })), mockScores: [],
  }));
}

// ── Components ────────────────────────────────────────────────────────────────
function ProgressRing({ pct, size=80, stroke=8, color='#6366f1' }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        style={{transition:'stroke-dashoffset 0.6s ease'}}/>
      <text x={size/2} y={size/2} fill="white" fontSize={size*0.2} textAnchor="middle"
        dominantBaseline="middle"
        style={{transform:`rotate(90deg)`,transformOrigin:`${size/2}px ${size/2}px`}}>
        {Math.round(pct)}%
      </text>
    </svg>
  );
}

function MiniChart({ scores, color='#6366f1' }) {
  if (!scores || scores.length < 2)
    return <div style={{height:40,display:'flex',alignItems:'center',justifyContent:'center',opacity:.35,fontSize:12}}>ยังไม่มีข้อมูล</div>;
  const pts = scores.slice(-8);
  const w = 120, h = 40;
  const polyPts = pts.map((s,i) => `${(i/(pts.length-1))*w},${h-((s/100)*h)}`).join(' ');
  return (
    <svg width={w} height={h} style={{overflow:'visible'}}>
      <polyline points={polyPts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((s,i) => <circle key={i} cx={(i/(pts.length-1))*w} cy={h-((s/100)*h)} r="3.5" fill={color}/>)}
    </svg>
  );
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
  const colors = { error:'#ef4444', success:'#10b981', info:'#6366f1' };
  return (
    <div className="toast-anim" style={{
      position:'fixed', top:72, right:16, zIndex:9999,
      background: colors[type] || colors.info, color:'white',
      padding:'12px 18px', borderRadius:12, maxWidth:280, fontSize:14,
      boxShadow:'0 4px 24px rgba(0,0,0,0.5)', cursor:'pointer',
    }} onClick={onClose}>{message}</div>
  );
}

        const d = snap.data();

        if (d.logs)        setLogs(d.logs);
        if (d.streak != null) setStreak(d.streak);
        if (d.weeklyPlan)  setWeeklyPlan(d.weeklyPlan);
        if (d.tcasEvents)  setTcasEvents(d.tcasEvents);
      }
    }, e => showToast('โหลดข้อมูลไม่ได้: ' + e.message, 'error'));
    return () => unsub();
  }, []);

  const save = async (updates) => {
    setSyncing(true);
    try { await db.doc(DOC_PATH).set(updates, { merge: true }); }
    catch(e) { showToast('บันทึกไม่สำเร็จ: ' + e.message, 'error'); }
    finally { setSyncing(false); }
  };

  // Subject actions
  const toggleTopic = (subId, idx) => {
    const updated = subjects.map(s => s.id !== subId ? s : {
      ...s, topics: s.topics.map((t,i) => i===idx ? {...t, read: !t.read} : t)
    });
    setSubjects(updated);
    save({ subjects: updated });
  };

  const addMockScore = (subId, score) => {
    const updated = subjects.map(s => s.id !== subId ? s : { ...s, mockScores: [...s.mockScores, score] });
    const newLogs = [{ subId, score, date: new Date().toISOString() }, ...logs].slice(0, 200);

    setSubjects(updated); setLogs(newLogs); setStreak(newStreak);
    save({ subjects: updated, logs: newLogs, streak: newStreak });
    showToast(`บันทึก ${score}% ✓`, 'success');

  const updateTcasEvent = (id, changes) => {
    const updated = tcasEvents.map(e => e.id === id ? { ...e, ...changes } : e);
    setTcasEvents(updated);
    setEditingTcas(null);
    save({ tcasEvents: updated });
    showToast('บันทึกกำหนดการแล้ว ✓', 'success');
  };

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:16}}>
        {subjects.map(sub => {
          const c = SUB_COLORS[sub.id] || {from:'#6366f1',to:'#4f46e5',text:'#c7d2fe',label:sub.id};
          const pct = getReadPct(sub);
          const avg = getAvgScore(sub);
          const last = getLastScore(sub);
          return (
            <div key={sub.id} className="card-hover" onClick={() => setSelectedSubId(sub.id)}
              style={{background:`linear-gradient(135deg,${c.from},${c.to})`,borderRadius:20,padding:20,
                cursor:'pointer',boxShadow:'0 4px 20px rgba(0,0,0,0.3)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{color:c.text,fontSize:11,fontWeight:700,letterSpacing:.3,marginBottom:4}}>{c.label}</div>
                  <div style={{fontSize:13,opacity:.85}}>
                    {sub.topics.filter(t=>t.read).length}/{sub.topics.length} บท
                  </div>
                </div>
                <ProgressRing pct={pct} size={58} stroke={6} color="rgba(255,255,255,0.9)"/>
              </div>
              <div style={{background:'rgba(0,0,0,0.22)',borderRadius:8,padding:'6px 10px',fontSize:12}}>
                {avg !== null
                  ? `📊 avg ${avg}% · สูงสุด ${Math.max(...sub.mockScores)}%`
                  : '📝 ยังไม่มี mock score'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── Analytics Tab ──────────────────────────────────────────────────────────
  const AnalyticsTab = () => (
    <div className="fade-in">
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16,marginBottom:20}}>
        <div className="glass" style={{borderRadius:16,padding:20}}>
          <div style={{fontSize:12,opacity:.55,marginBottom:4}}>ความคืบหน้าภาพรวม</div>
          <div style={{fontSize:32,fontWeight:800,color:'#a78bfa'}}>{overallPct}%</div>
          <div style={{fontSize:12,opacity:.4}}>เฉลี่ยทุกวิชา</div>
        </div>
        <div className="glass" style={{borderRadius:16,padding:20}}>
          <div style={{fontSize:12,opacity:.55,marginBottom:4}}>Mock Tests ทั้งหมด</div>
          <div style={{fontSize:32,fontWeight:800,color:'#34d399'}}>{logs.length}</div>
          <div style={{fontSize:12,opacity:.4}}>ครั้งที่ทำ</div>
        </div>
        <div className="glass" style={{borderRadius:16,padding:20}}>
          <div style={{fontSize:12,opacity:.55,marginBottom:4}}>Streak ปัจจุบัน</div>
          <div style={{fontSize:32,fontWeight:800,color:'#f97316'}}>{streak}</div>
          <div style={{fontSize:12,opacity:.4}}>วันติดต่อกัน</div>
        </div>
        <div className="glass" style={{borderRadius:16,padding:20}}>
          <div style={{fontSize:12,opacity:.55,marginBottom:4}}>เหรียญที่ได้</div>
          <div style={{fontSize:32,fontWeight:800,color:'#fbbf24'}}>{earnedBadges.length}/{BADGES.length}</div>
          <div style={{fontSize:12,opacity:.4}}>badges</div>
        </div>
      </div>
      {/* Per-subject analytics */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:14}}>
        {subjects.map(sub => {
          const c = SUB_COLORS[sub.id] || {from:'#6366f1',label:sub.id};
          const avg = getAvgScore(sub);
          const pct = getReadPct(sub);
          return (
            <div key={sub.id} className="glass" style={{borderRadius:16,padding:16}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:700}}>{c.label}</div>
                <div style={{fontSize:13,fontWeight:700,color:c.from}}>{avg !== null ? avg+'%' : '-'}</div>
              </div>
              <MiniChart scores={sub.mockScores} color={c.from}/>
              <div style={{marginTop:10,display:'flex',alignItems:'center',gap:8}}>
                <div style={{flex:1,height:5,background:'rgba(255,255,255,0.08)',borderRadius:3}}>
                  <div style={{width:`${pct}%`,height:'100%',background:`linear-gradient(90deg,${c.from},${c.to||c.from})`,borderRadius:3,transition:'width 0.5s'}}/>
                </div>
                <span style={{fontSize:11,opacity:.55,whiteSpace:'nowrap'}}>{pct}% อ่าน</span>
              </div>
              {sub.mockScores.length > 0 && (
                <div style={{marginTop:8,display:'flex',gap:12,fontSize:11,opacity:.6}}>
                  <span>🎯 สูงสุด {Math.max(...sub.mockScores)}%</span>
                  <span>📌 {sub.mockScores.length} ครั้ง</span>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── Weekly Tab ─────────────────────────────────────────────────────────────
  const DAYS = [['mon','จ.'],['tue','อ.'],['wed','พ.'],['thu','พฤ.'],['fri','ศ.'],['sat','ส.'],['sun','อา.']];
  const WeeklyTab = () => (
    <div className="fade-in">
      <div className="glass" style={{borderRadius:18,padding:20}}>
        <h3 style={{margin:'0 0 16px',fontSize:16,fontWeight:700}}>📅 แผนการเรียนรายสัปดาห์</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:10}}>
          {DAYS.map(([key, label]) => (
            <div key={key} style={{display:'flex',flexDirection:'column',gap:6}}>
              <div style={{textAlign:'center',fontSize:13,fontWeight:700,opacity:.6,
                paddingBottom:6,borderBottom:'1px solid rgba(255,255,255,0.08)'}}>{label}</div>
              <textarea
                value={weeklyPlan[key] || ''}
                onChange={e => updateWeekly(key, e.target.value)}
                placeholder="แผน..."
                style={{width:'100%',minHeight:110,background:'rgba(255,255,255,0.04)',
                  border:'1px solid rgba(255,255,255,0.08)',borderRadius:10,color:'#e2e8f0',
                  fontSize:12,padding:8,resize:'vertical',lineHeight:1.5}}
              />
            </div>
          ))}
        </div>
      </div>
    </div>
  );

  // ── Logs Tab ───────────────────────────────────────────────────────────────
  const LogsTab = () => (
    <div className="fade-in">
      <div className="glass" style={{borderRadius:18,padding:20}}>
        <h3 style={{margin:'0 0 16px',fontSize:16,fontWeight:700}}>📋 ประวัติ Mock Test</h3>
        {logs.length === 0
          ? <div style={{textAlign:'center',opacity:.35,padding:48,fontSize:15}}>ยังไม่มีบันทึก</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {logs.map((log, i) => {
                const c = SUB_COLORS[log.subId] || {from:'#6366f1',label:log.subId};
                const scoreColor = log.score>=80?'#34d399':log.score>=60?'#fbbf24':'#f87171';
                return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:12,
                    background:'rgba(255,255,255,0.03)',borderRadius:12,padding:'10px 16px',
                    borderLeft:`3px solid ${c.from}`}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600}}>{c.label}</div>
                      <div style={{fontSize:11,opacity:.45}}>
                        {new Date(log.date).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
                      </div>
                    </div>
                    <div style={{fontSize:20,fontWeight:800,color:scoreColor}}>{log.score}%</div>
                  </div>
                );
              })}
            </div>
        }
      </div>
    </div>
  );

  // ── TCAS Tab ───────────────────────────────────────────────────────────────
  const TcasTab = () => (
    <div className="fade-in">
      {/* Next event highlight */}
      {nextTcas && (
        <div style={{background:`linear-gradient(135deg,${nextTcas.color}25,${nextTcas.color}08)`,
          border:`1px solid ${nextTcas.color}40`,borderRadius:18,padding:20,marginBottom:20}}>
          <div style={{fontSize:11,opacity:.6,marginBottom:6}}>🎯 กำหนดการถัดไป</div>
          <div style={{fontSize:18,fontWeight:800,marginBottom:6}}>{nextTcas.event}</div>
          <div style={{display:'flex',gap:16,alignItems:'center'}}>
            <span style={{fontSize:13,opacity:.6}}>{nextTcas.period}</span>
            <span style={{fontSize:14,fontWeight:700,color:nextTcas.color}}>
              ⏳ อีก {getCountdown(nextTcas.date).text}
            </span>
          </div>
        </div>
      )}

      {/* Event list */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {tcasEvents.map(ev => {
          const cd = getCountdown(ev.date);
          const isEdit = editingTcas === ev.id;
          return (
            <div key={ev.id} style={{background:'rgba(255,255,255,0.04)',borderRadius:14,padding:16,
              borderLeft:`4px solid ${cd.past ? 'rgba(255,255,255,0.15)' : ev.color}`,
              opacity: cd.past ? 0.5 : 1,
              display:'flex',alignItems:'center',gap:12}}>
              {/* Indicator */}
              <div style={{width:9,height:9,borderRadius:'50%',
                background: cd.past ? 'rgba(255,255,255,0.2)' : ev.color,flexShrink:0}}/>
              {/* Content */}
              <div style={{flex:1,minWidth:0}}>
                {isEdit ? (
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <input id={`ev-n-${ev.id}`} defaultValue={ev.event}
                      style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.2)',
                        borderRadius:8,color:'white',padding:'6px 10px',fontSize:13,width:'100%'}}/>
                    <div style={{display:'flex',gap:8}}>
                      <input type="date" id={`ev-d-${ev.id}`} defaultValue={ev.date}
                        style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.2)',
                          borderRadius:8,color:'white',padding:'6px 10px',fontSize:12,flex:1}}/>
                      <button onClick={() => updateTcasEvent(ev.id, {
                          event: document.getElementById(`ev-n-${ev.id}`).value,
                          date:  document.getElementById(`ev-d-${ev.id}`).value,
                        })}
                        style={{background:'#10b981',border:'none',borderRadius:8,color:'white',
                          padding:'6px 14px',cursor:'pointer',fontSize:12,fontWeight:700}}>บันทึก</button>
                      <button onClick={() => setEditingTcas(null)}
                        style={{background:'rgba(255,255,255,0.08)',border:'none',borderRadius:8,color:'white',
                          padding:'6px 10px',cursor:'pointer',fontSize:12}}>ยกเลิก</button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{fontSize:14,fontWeight:600,marginBottom:3,
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event}</div>
                    <div style={{fontSize:12,opacity:.5}}>{ev.period} &nbsp;·&nbsp;
                      {new Date(ev.date).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})}</div>
                  </>
                )}
              </div>
              {/* Countdown */}
              {!isEdit && (
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:700,
                    color: cd.past ? 'rgba(255,255,255,0.3)' : ev.color}}>{cd.text}</div>
                  {!cd.past && <div style={{fontSize:11,opacity:.35}}>เหลือ</div>}
                </div>
              )}
              {/* Edit btn */}
              {!isEdit && (
                <button onClick={() => setEditingTcas(ev.id)}
                  style={{background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',
                    borderRadius:8,color:'white',padding:'6px 10px',cursor:'pointer',fontSize:13,flexShrink:0}}>✏️</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── Subject Modal ──────────────────────────────────────────────────────────
  const Modal = () => {
    if (!selectedSub) return null;
    const c = SUB_COLORS[selectedSub.id] || {from:'#6366f1',to:'#4f46e5',text:'#c7d2fe',label:selectedSub.id};
    const pct = getReadPct(selectedSub);
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,
        display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(4px)'}}
        onClick={e => { if(e.target===e.currentTarget) setSelectedSubId(null); }}>
        <div style={{background:'#15152a',borderRadius:24,width:'100%',maxWidth:520,
          maxHeight:'88vh',overflow:'auto',boxShadow:'0 24px 80px rgba(0,0,0,0.7)'}}>
          {/* Modal header */}
          <div style={{background:`linear-gradient(135deg,${c.from},${c.to})`,borderRadius:'24px 24px 0 0',padding:24}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{color:c.text,fontSize:11,fontWeight:700,letterSpacing:.5,marginBottom:4}}>{c.label}</div>
                <div style={{fontSize:22,fontWeight:800}}>ความคืบหน้า {pct}%</div>
                <div style={{fontSize:13,opacity:.75,marginTop:2}}>
                  {selectedSub.topics.filter(t=>t.read).length}/{selectedSub.topics.length} บทที่อ่านแล้ว
                </div>
              </div>
              <button onClick={() => setSelectedSubId(null)}
                style={{background:'rgba(0,0,0,0.3)',border:'none',borderRadius:'50%',
                  width:36,height:36,color:'white',cursor:'pointer',fontSize:20,
                  display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
            </div>
          </div>
          <div style={{padding:24}}>
            {/* Topics */}
            <div style={{marginBottom:24}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:10,opacity:.7}}>บทที่เรียน</div>
              {selectedSub.topics.map((topic, i) => (
                <div key={i} onClick={() => toggleTopic(selectedSub.id, i)}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',
                    borderRadius:10,cursor:'pointer',marginBottom:5,transition:'background 0.15s',
                    background: topic.read ? `${c.from}1a` : 'rgba(255,255,255,0.03)',
                    border: `1px solid ${topic.read ? c.from+'30' : 'rgba(255,255,255,0.05)'}`}}>
                  <div style={{width:22,height:22,borderRadius:7,flexShrink:0,
                    background: topic.read ? c.from : 'rgba(255,255,255,0.08)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:13,fontWeight:700,transition:'background 0.2s'}}>
                    {topic.read ? '✓' : ''}
                  </div>
                  <span style={{fontSize:13,textDecoration:topic.read?'line-through':'none',opacity:topic.read?.55:1}}>
                    {topic.name}
                  </span>
                </div>
              ))}
            </div>
            {/* Mock score */}
            <div style={{background:'rgba(255,255,255,0.03)',borderRadius:14,padding:18,
              border:'1px solid rgba(255,255,255,0.06)'}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:12,opacity:.7}}>บันทึกคะแนน Mock Test</div>
              <div style={{display:'flex',gap:8,marginBottom:12}}>
                <input type="number" min="0" max="100" value={mockInput}
                  onChange={e => setMockInput(e.target.value)}
                  onKeyDown={e => { if(e.key==='Enter'){ const s=parseInt(mockInput); if(!isNaN(s)&&s>=0&&s<=100){addMockScore(selectedSub.id,s);setMockInput('');} }}}
                  placeholder="คะแนน (0–100)"
                  style={{flex:1,background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.12)',
                    borderRadius:10,color:'white',padding:'10px 14px',fontSize:14}}/>
                <button onClick={() => {
                  const s = parseInt(mockInput);
                  if(isNaN(s)||s<0||s>100) return showToast('กรุณากรอกคะแนน 0–100', 'error');
                  addMockScore(selectedSub.id, s);
                  setMockInput('');
                }} style={{background:`linear-gradient(135deg,${c.from},${c.to})`,
                  border:'none',borderRadius:10,color:'white',padding:'10px 20px',
                  cursor:'pointer',fontWeight:700,fontSize:14}}>บันทึก</button>
              </div>
              {selectedSub.mockScores.length > 0 && (
                <>
                  <MiniChart scores={selectedSub.mockScores} color={c.from}/>
                  <div style={{display:'flex',gap:16,marginTop:10,fontSize:12,opacity:.6}}>
                    <span>avg: {getAvgScore(selectedSub)}%</span>
                    <span>สูงสุด: {Math.max(...selectedSub.mockScores)}%</span>
                    <span>ต่ำสุด: {Math.min(...selectedSub.mockScores)}%</span>
                    <span>ทำมา {selectedSub.mockScores.length} ครั้ง</span>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ── Tabs config ────────────────────────────────────────────────────────────
  const TABS = [
    { id:'overview',  icon:'🏠', label:'ภาพรวม',      Content: OverviewTab  },
    { id:'analytics', icon:'📈', label:'วิเคราะห์',    Content: AnalyticsTab },
    { id:'weekly',    icon:'📅', label:'รายสัปดาห์',   Content: WeeklyTab    },
    { id:'logs',      icon:'📋', label:'บันทึก',       Content: LogsTab      },
    { id:'tcas',      icon:'🗓️', label:'TCAS',         Content: TcasTab      },
  ];
  const currentTab = TABS.find(t => t.id === activeTab) || TABS[0];
  const { Content } = currentTab;

  // ── Render ─────────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:'100vh',background:'#0f0f1a'}}>
      {/* Header */}
      <div style={{background:'rgba(15,15,26,0.92)',borderBottom:'1px solid rgba(255,255,255,0.07)',
        padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',
        position:'sticky',top:0,zIndex:500,backdropFilter:'blur(12px)'}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,letterSpacing:'-0.5px'}}>MED71 Dashboard</div>
          <div style={{fontSize:11,opacity:.38}}>Monitor &amp; Evaluation · TCAS70</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {syncing && <span className="pulse" style={{fontSize:12,opacity:.45}}>⟳ บันทึก...</span>}
          <span style={{fontSize:18}}>🔥 {streak}</span>
        </div>
      </div>

      {/* Tab nav */}
      <div style={{display:'flex',gap:0,overflowX:'auto',
        background:'rgba(255,255,255,0.02)',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            style={{border:'none',borderBottom: activeTab===t.id ? '2px solid #6366f1' : '2px solid transparent',
              padding:'11px 18px',color: activeTab===t.id ? '#fff' : 'rgba(255,255,255,0.45)',
              background: activeTab===t.id ? 'rgba(99,102,241,0.12)' : 'transparent',
              cursor:'pointer',fontSize:13,whiteSpace:'nowrap',fontWeight: activeTab===t.id ? 700 : 400,
              transition:'all 0.2s'}}>
            {t.icon} {t.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{padding:20,maxWidth:920,margin:'0 auto'}}>
        <Content/>
      </div>

      <Modal/>
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
